name: Apply P6.10 checker hardening

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/agent-apply-p610-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boolean_symbolic
          fetch-depth: 0
      - name: Apply reviewed patch and commit
        shell: bash
        env:
          PATCH_A: ''
          PATCH_B: ''
        run: |
          set -euo pipefail
          printf '%s%s' "$PATCH_A" "$PATCH_B" | base64 --decode | gzip --decompress > /tmp/p610-hardening.patch
          echo '2292e0af9415ea0f28f016b735df0c420dd900840c23ed7e403edad18cee7b3c  /tmp/p610-hardening.patch' | sha256sum --check --strict
          git apply --check /tmp/p610-hardening.patch
          git apply --index /tmp/p610-hardening.patch
          rm .github/workflows/agent-apply-p610-hardening.yml
          git add -A
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git commit -m 'Implement Plan 16 P6.10 candidate checker hardening'
          git push origin HEAD:boolean_symbolic
