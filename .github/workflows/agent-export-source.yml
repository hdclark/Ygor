name: Agent export source

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack source tree
        shell: bash
        run: tar --exclude=.git --exclude=source-tree.tar.gz -czf source-tree.tar.gz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: source-tree
          path: source-tree.tar.gz
          if-no-files-found: error
