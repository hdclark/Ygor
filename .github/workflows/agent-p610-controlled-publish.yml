name: Publish focused P6.10 controlled campaign

on:
  push:
    branches:
      - agent/p610-controlled-publish
    paths:
      - '.github/workflows/agent-p610-controlled-publish.yml'
  pull_request:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/agent-p610-controlled-publish.yml'
      - '.agent/**'

permissions:
  contents: write

jobs:
  apply-validate-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p610-controlled-publish
          fetch-depth: 0
      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/p610-part-* | base64 --decode > /tmp/p610.patch.gz
          echo 'c43721fb9d68f603cc6041afee45018432439930e0f3f5e8e2e73ba01cff9a24  /tmp/p610.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/p610.patch.gz > /tmp/p610.patch
          echo '1ee4c0e72aba08321300dc1213967997a319fae56b39cc03a1d677df572719a9  /tmp/p610.patch' | sha256sum --check
          git apply --index /tmp/p610.patch
      - name: Merge deferral-overlap files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          qualification = Path('docs/MeshBooleanQualification.md')
          text = qualification.read_text()
          section = '''
          ## P6.10 controlled non-fuzz campaign

          The P6.10 controlled campaign workflow runs every version-controlled Plan 16 P6
          requirement except the explicitly deferred 24-hour fuzz-duration floor across
          the frozen 15-case compiler, library, architecture, sanitizer, and debug-mode
          matrix. `MeshBooleanQualificationCandidateCampaign` rejects a missing pass
          record from any declared toolchain and emits canonical incomplete-campaign
          artifacts only after all non-deferred runs succeed. The duration entries remain
          in the plan as unresolved infrastructure issues and must be executed and
          reviewed offline before P6.10 or any production profile can close.
          '''.lstrip()
          if '## P6.10 controlled non-fuzz campaign' not in text:
              qualification.write_text(text.rstrip() + '\n\n' + section)

          candidate = Path('docs/MeshBooleanQualificationCandidate.md')
          text = candidate.read_text()
          section = '''
          ## Controlled non-fuzz campaign assembly

          `YgorMeshesBooleanQualificationCandidateCampaign.h` and the
          `MeshBooleanQualificationCandidateCampaign` executable turn independently
          retained verbose test logs into one canonical, incomplete P6.10 campaign. The
          assembler reads the version-controlled Plan 16 requirement inventory, requires
          every non-deferred requirement identifier to appear as a passing record in every
          declared toolchain log, and rejects failed, missing, duplicate, foreign, stale,
          or malformed evidence before publication.

          Each toolchain record binds its exact compiler and standard-library versions,
          architecture, operating system, target triple, build mode, strict
          floating-point mode, coordinate/index specialization, compile flags,
          environment digest, complete run-log digest, and independent pass-inventory
          digest. Requirement and toolchain arrival order cannot affect the canonical
          manifest, plan, observations, issues, or campaign bytes.

          The only accepted deferral is the frozen `P6-FUZZ-DURATION-001` requirement.
          It remains one execution case per declared toolchain, produces canonical
          `qualification_candidate.deferred_offline` observations, and remains an
          unresolved infrastructure issue. The assembler cannot defer P6.2-P6.7, the
          non-duration P6.8 matrix checks, P6.9, or the P6.10 closure contracts.

          `.github/workflows/mesh-boolean-p6-candidate-campaign.yml` executes the
          non-fuzz requirement suite over the 15 frozen P6.8 toolchain configurations:
          current and oldest-supported GCC/Clang, Debug and optimized builds,
          libstdc++/libc++, x86-64/AArch64, ASan/UBSan, TSan, and both debug-library
          modes. The aggregation job requires all 15 jobs, reconstructs the exact
          repository commit and tree, and publishes canonical plan, campaign, summary,
          and observation artifacts transactionally. These artifacts remain incomplete
          candidate evidence and cannot promote any backend or profile while the offline
          fuzz issues remain unresolved.
          '''.lstrip()
          if '## Controlled non-fuzz campaign assembly' not in text:
              candidate.write_text(text.rstrip() + '\n\n' + section)

          inventory = Path('tests/mesh_boolean/requirements.tsv')
          lines = inventory.read_text().splitlines()
          comments = [line for line in lines if line.startswith('#')]
          rows = {}
          for line in lines:
              if not line or line.startswith('#'):
                  continue
              fields = line.split('\t')
              if len(fields) != 6:
                  raise SystemExit('malformed requirements row: ' + line)
              rows[fields[0]] = line
          rows['P6-CANDIDATE-CAMPAIGN-001'] = 'P6-CANDIDATE-CAMPAIGN-001\tplan16.P6.10\tall non-deferred Plan 16 requirement tests pass on every declared toolchain and the exact 24-hour fuzz entry remains a canonical unresolved blocker\tP6.10.campaign.controlled_slice\tqualification\tcontinuous'
          rows['P6-CANDIDATE-DEFER-001'] = 'P6-CANDIDATE-DEFER-001\tplan16.P6.10\toffline deferrals retain frozen cases, produce canonical blocking infrastructure evidence, skip only named executor calls, reject malformed inventories, and close only after reviewed rerun\tP6.10.deferred\tnegative\tcontinuous'
          rows['P6-COMPARE-001'] = 'P6-COMPARE-001\tplan16.P6.4\tindependent backend campaign retains complete attempts, guarded probes, minimization, classified resolutions, failures, and zero unexplained material disagreement\tP6.4.campaign\tqualification\tcontinuous'
          inventory.write_text('\n'.join(comments + [rows[key] for key in sorted(rows)]) + '\n')
          PY
          git add docs/MeshBooleanQualification.md \
            docs/MeshBooleanQualificationCandidate.md \
            tests/mesh_boolean/requirements.tsv
          git diff --cached --check
      - name: Validate standalone P6.10 targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tests/p610 -B build-agent-p610 -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF
          cmake --build build-agent-p610 --parallel 1 --target \
            Test_MeshesBooleanQualificationCandidate \
            Test_MeshesBooleanQualificationCandidateCampaign \
            MeshBooleanQualificationCandidateCampaign
          ctest --test-dir build-agent-p610 --output-on-failure \
            -R '^MeshBoolean\.QualificationCandidate(Campaign)?$' \
            --timeout 1200
      - name: Commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent .github/workflows/agent-p610-controlled-publish.yml build-agent-p610
          git add -A
          git diff --cached --check
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git commit -m 'Implement Plan 16 P6.10 controlled non-fuzz campaign'
          git push origin HEAD:agent/p610-controlled-publish
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
