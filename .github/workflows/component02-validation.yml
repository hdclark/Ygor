name: Component 02 validation

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

concurrency:
  group: component02-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0

      - name: Apply validation corrections and regression
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 .github/component02_validation_patch.py 2>&1 | tee component02-validation.log

      - name: Configure and test with GCC
        id: gcc
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build-gcc \
            -DBUILD_TESTING=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF \
            -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee -a component02-validation.log
          cmake --build build-gcc \
            --target ygor_mesh_boolean_input_validation_tests -j2 2>&1 | \
            tee -a component02-validation.log
          ctest --test-dir build-gcc --output-on-failure \
            -R '^mesh_boolean_bounded_component02_' 2>&1 | \
            tee -a component02-validation.log

      - name: Configure and test with Clang
        id: clang
        if: steps.apply.outcome == 'success' && steps.gcc.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -o pipefail
          cmake -S . -B build-clang \
            -DBUILD_TESTING=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee -a component02-validation.log
          cmake --build build-clang \
            --target ygor_mesh_boolean_input_validation_tests -j2 2>&1 | \
            tee -a component02-validation.log
          ctest --test-dir build-clang --output-on-failure \
            -R '^mesh_boolean_bounded_component02_' 2>&1 | \
            tee -a component02-validation.log

      - name: Publish validation result
        if: always()
        shell: bash
        run: |
          git config user.name "Component 02 validation agent"
          git config user.email "actions@users.noreply.github.com"
          if [[ "${{ steps.apply.outcome }}" == "success" && \
                "${{ steps.gcc.outcome }}" == "success" && \
                "${{ steps.clang.outcome }}" == "success" ]]; then
            python3 - <<'PY'
          from pathlib import Path
          tracker = Path('tracker.md')
          text = tracker.read_text()
          old = '- [ ] Component 2: validate partial implementation.'
          new = '- [x] Component 2: validate partial implementation.'
          if text.count(old) != 1:
              raise SystemExit('Component 02 validation tracker entry is not uniquely available')
          tracker.write_text(text.replace(old, new, 1))
          Path('.github/workflows/component02-validation.yml').unlink()
          Path('.github/component02_validation_patch.py').unlink()
          Path('component02-validation.log').unlink(missing_ok=True)
          PY
            git add .
            git commit -m "Validate component 2 partial implementation (plan 02)"
          else
            {
              echo '# Component 02 validation failure'
              echo
              echo "apply outcome: ${{ steps.apply.outcome }}"
              echo "GCC outcome: ${{ steps.gcc.outcome }}"
              echo "Clang outcome: ${{ steps.clang.outcome }}"
              echo
              echo '```text'
              tail -n 400 component02-validation.log 2>/dev/null || true
              echo '```'
            } > component_02_validation_failure.md
            git add component_02_validation_failure.md
            git commit -m "Record Component 2 validation failure"
          fi
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
