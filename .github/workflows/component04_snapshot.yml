name: Component 04 snapshot

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0

      - name: Apply Component 04 implementation
        shell: bash
        run: |
          cat .github/component04_source_*.py.part > /tmp/component04_implementation.py
          python3 -m py_compile /tmp/component04_implementation.py
          python3 /tmp/component04_implementation.py

      - name: Commit generated checkout
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --check
          git commit -m 'Materialize Component 04 implementation for diagnosis'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
