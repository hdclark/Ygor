name: Component 05 implementation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: component05-implementation
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0

      - name: Recover complete files from Component 05 archive prefix
        shell: bash
        run: |
          set -o pipefail
          cat .github/component05_payload_0[0-4].b64 | base64 --decode > /tmp/component05-prefix.tar.gz
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path, PurePosixPath
          import zlib

          compressed = Path('/tmp/component05-prefix.tar.gz').read_bytes()
          inflater = zlib.decompressobj(16 + zlib.MAX_WBITS)
          data = inflater.decompress(compressed)
          manifest = [
              f'compressed_bytes {len(compressed)}',
              f'compressed_sha256 {sha256(compressed).hexdigest()}',
              f'decompressed_prefix_bytes {len(data)}',
          ]
          position = 0
          recovered = []
          while position + 512 <= len(data):
              header = data[position:position + 512]
              if header == bytes(512):
                  break
              name = header[:100].split(b'\0', 1)[0].decode('utf-8', 'strict')
              prefix = header[345:500].split(b'\0', 1)[0].decode('utf-8', 'strict')
              if prefix:
                  name = prefix + '/' + name
              size_text = header[124:136].split(b'\0', 1)[0].strip() or b'0'
              size = int(size_text, 8)
              typeflag = header[156:157]
              payload_start = position + 512
              payload_end = payload_start + size
              padded_end = payload_start + ((size + 511) // 512) * 512
              if padded_end > len(data):
                  manifest.append(f'incomplete {name} size {size} available {max(0, len(data)-payload_start)}')
                  break
              path = PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'unsafe archive path: {name}')
              if typeflag in (b'0', b'\0'):
                  target = Path(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  payload = data[payload_start:payload_end]
                  target.write_bytes(payload)
                  recovered.append((name, size, sha256(payload).hexdigest()))
              position = padded_end
          manifest.append(f'complete_files {len(recovered)}')
          manifest.extend(f'{name} {size} {digest}' for name, size, digest in recovered)
          Path('.github/component05_recovery_manifest.txt').write_text('\n'.join(manifest) + '\n')
          print('\n'.join(manifest))
          PY
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --check
          git commit -m 'Recover component 05 implementation archive prefix'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
