name: Component 05 implementation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: component05-implementation
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0

      - name: Diagnose Component 05 archive transport
        shell: bash
        run: |
          set -o pipefail
          git show e7528352ab77a0eed2ba2df03ae96d5b2d8168ff:.github/component05_payload_00.b64 > /tmp/component05-original.b64
          cat .github/component05_payload_0[0-4].b64 > /tmp/component05-prefix.b64
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          original = Path('/tmp/component05-original.b64').read_bytes()
          prefix = Path('/tmp/component05-prefix.b64').read_bytes()
          print('original_length', len(original))
          print('prefix_length', len(prefix))
          print('original_sha256', sha256(original).hexdigest())
          print('prefix_sha256', sha256(prefix).hexdigest())
          mismatch = next((i for i, (a, b) in enumerate(zip(original, prefix)) if a != b), None)
          print('first_prefix_mismatch', mismatch)
          allowed = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n')
          bad = [i for i, value in enumerate(original) if value not in allowed]
          print('bad_count', len(bad))
          print('bad_positions', bad[:100])
          for marker in (b'ELLIPSIZATION', b'[...', b'... (truncated)', b'...'):
              positions = []
              start = 0
              while True:
                  found = original.find(marker, start)
                  if found < 0:
                      break
                  positions.append(found)
                  start = found + 1
              print('marker', marker, positions[:20], 'count', len(positions))
          if bad:
              lo = max(0, bad[0] - 80)
              hi = min(len(original), bad[0] + 160)
              print('bad_context', repr(original[lo:hi]))
          raise SystemExit('archive transport diagnostic complete')
          PY

      - name: Upload validation log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component05-validation-log
          path: component05-validation.log
          if-no-files-found: ignore
