name: Component 05 implementation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: component05-implementation
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0

      - name: Persist Component 05 archive diagnostic
        shell: bash
        run: |
          set -o pipefail
          git show e7528352ab77a0eed2ba2df03ae96d5b2d8168ff:.github/component05_payload_00.b64 > /tmp/component05-original.b64
          cat .github/component05_payload_0[0-4].b64 > /tmp/component05-prefix.b64
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          original = Path('/tmp/component05-original.b64').read_bytes()
          prefix = Path('/tmp/component05-prefix.b64').read_bytes()
          lines = []
          add = lines.append
          add(f'original_length {len(original)}')
          add(f'prefix_length {len(prefix)}')
          add(f'original_sha256 {sha256(original).hexdigest()}')
          add(f'prefix_sha256 {sha256(prefix).hexdigest()}')
          mismatch = next((i for i, (a, b) in enumerate(zip(original, prefix)) if a != b), None)
          add(f'first_prefix_mismatch {mismatch}')
          add(f'original_starts_with_prefix {original.startswith(prefix)}')
          allowed = set(b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n')
          bad = [i for i, value in enumerate(original) if value not in allowed]
          add(f'bad_count {len(bad)}')
          add(f'bad_positions {bad[:100]}')
          for marker in (b'ELLIPSIZATION', b'[...', b'... (truncated)', b'...'):
              positions = []
              start = 0
              while True:
                  found = original.find(marker, start)
                  if found < 0:
                      break
                  positions.append(found)
                  start = found + 1
              add(f'marker {marker!r} positions {positions[:20]} count {len(positions)}')
          if mismatch is not None:
              lo = max(0, mismatch - 120)
              hi = min(len(original), mismatch + 240)
              add(f'mismatch_original_context {original[lo:hi]!r}')
              add(f'mismatch_prefix_context {prefix[lo:min(len(prefix), hi)]!r}')
          if bad:
              lo = max(0, bad[0] - 120)
              hi = min(len(original), bad[0] + 240)
              add(f'bad_context {original[lo:hi]!r}')
          Path('.github/component05_transport_diagnostic.txt').write_text('\n'.join(lines) + '\n')
          PY
          cat .github/component05_transport_diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/component05_transport_diagnostic.txt
          git commit -m 'Record component 05 archive transport diagnostic'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
