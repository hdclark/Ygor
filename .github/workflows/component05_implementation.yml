name: Component 05 implementation

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: component05-implementation
  cancel-in-progress: true

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0

      - name: Apply Component 05 implementation
        shell: bash
        run: |
          set -o pipefail
          cat .github/component05_payload_*.b64 | base64 --decode | tar -xzf -
          python3 -m py_compile .github/component05_apply.py
          python3 .github/component05_apply.py
          git diff --check

      - name: Configure and test with GCC
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build-component05-gcc \
            -DBUILD_TESTING=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF \
            -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee component05-validation.log
          cmake --build build-component05-gcc \
            --target ygor_mesh_boolean_canonical_halfedge_tests -j2 2>&1 | \
            tee -a component05-validation.log
          ctest --test-dir build-component05-gcc --output-on-failure \
            -R '^mesh_boolean_bounded_component05_' 2>&1 | \
            tee -a component05-validation.log
          cmake --build build-component05-gcc --target \
            ygor_mesh_boolean_bounded_tests \
            ygor_mesh_boolean_input_validation_tests \
            ygor_mesh_boolean_precision_tests \
            ygor_mesh_boolean_precision_numeric_tests \
            ygor_mesh_boolean_precision_operations_tests \
            ygor_mesh_boolean_precision_state_tests \
            ygor_mesh_boolean_adaptive_compatibility_tests \
            ygor_mesh_boolean_precision_codec_tests \
            ygor_mesh_boolean_source_triangulation_tests -j2 2>&1 | \
            tee -a component05-validation.log
          ctest --test-dir build-component05-gcc --output-on-failure \
            -R '^mesh_boolean_bounded_component0[1-4]' 2>&1 | \
            tee -a component05-validation.log

      - name: Configure and test with Clang
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -o pipefail
          cmake -S . -B build-component05-clang \
            -DBUILD_TESTING=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee -a component05-validation.log
          cmake --build build-component05-clang \
            --target ygor_mesh_boolean_canonical_halfedge_tests -j2 2>&1 | \
            tee -a component05-validation.log
          ctest --test-dir build-component05-clang --output-on-failure \
            -R '^mesh_boolean_bounded_component05_' 2>&1 | \
            tee -a component05-validation.log
          cmake --build build-component05-clang --target \
            ygor_mesh_boolean_bounded_tests \
            ygor_mesh_boolean_input_validation_tests \
            ygor_mesh_boolean_precision_tests \
            ygor_mesh_boolean_precision_numeric_tests \
            ygor_mesh_boolean_precision_operations_tests \
            ygor_mesh_boolean_precision_state_tests \
            ygor_mesh_boolean_adaptive_compatibility_tests \
            ygor_mesh_boolean_precision_codec_tests \
            ygor_mesh_boolean_source_triangulation_tests -j2 2>&1 | \
            tee -a component05-validation.log
          ctest --test-dir build-component05-clang --output-on-failure \
            -R '^mesh_boolean_bounded_component0[1-4]' 2>&1 | \
            tee -a component05-validation.log

      - name: Configure sanitizer qualification
        shell: bash
        run: |
          set -o pipefail
          cmake -S . -B build-component05-sanitizer \
            -DBUILD_TESTING=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' 2>&1 | \
            tee -a component05-validation.log
          cmake --build build-component05-sanitizer \
            --target ygor_mesh_boolean_canonical_halfedge_tests -j2 2>&1 | \
            tee -a component05-validation.log
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1 \
            ctest --test-dir build-component05-sanitizer --output-on-failure \
              -R '^mesh_boolean_bounded_component05_' 2>&1 | \
              tee -a component05-validation.log

      - name: Commit Component 05
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tracker.md')
          text = path.read_text()
          old = '- [ ] Component 5: canonical halfedge topology.'
          new = '- [x] Component 5: canonical halfedge topology.'
          if text.count(old) != 1:
              raise SystemExit('tracker Component 5 entry not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/component05_payload_*.b64 .github/component05_apply.py
          rm -f .github/workflows/component05_implementation.yml
          rm -rf build-component05-gcc build-component05-clang build-component05-sanitizer
          rm -f component05-validation.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --check
          git commit -m 'Implement component 05 canonical halfedge topology (plan 05)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan

      - name: Upload validation log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component05-validation-log
          path: component05-validation.log
          if-no-files-found: ignore
