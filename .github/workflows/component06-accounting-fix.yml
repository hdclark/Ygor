name: Component 06 accounting fix

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed Component 06 fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          build = Path('src/YgorMeshesBooleanBounded/BroadPhaseBuild.h')
          text = build.read_text()

          pattern = re.compile(
              r'(?P<indent>\s*)if \(!transaction_\.begin_join\(\) \|\| !transaction_\.begin_verify\(\) \|\|\n'
              r'(?P=indent)    !transaction_\.ready\(\) \|\| !transaction_\.commit\(\)\) \{.*?\n'
              r'(?P=indent)\}\n'
              r'(?P=indent)auto published = std::shared_ptr<const canonical_candidate_stream<T, I>>\(\n'
              r'(?P=indent)    std::move\(artifact_\)\);',
              re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('publication block not found')
          indent = match.group('indent')
          replacement = (
              f'{indent}// Construct the immutable publication handle before the no-fail commit\n'
              f'{indent}// boundary. Moving a shared_ptr after commit is non-allocating.\n'
              f'{indent}auto published = std::shared_ptr<const canonical_candidate_stream<T, I>>(\n'
              f'{indent}    std::move(artifact_));\n'
              f'{indent}if (!transaction_.begin_join() || !transaction_.begin_verify() ||\n'
              f'{indent}    !transaction_.ready() || !transaction_.commit()) {{\n'
              f'{indent}  fail(broad_phase_subcode::transaction_failure,\n'
              f'{indent}       bounded_boolean_error_category::internal_invariant_error,\n'
              f'{indent}       "broad-phase transaction could not commit",\n'
              f'{indent}       broad_phase_checkpoint::transaction_commit);\n'
              f'{indent}  return failure();\n'
              f'{indent}}}')
          text = pattern.sub(replacement, text, count=1)

          pair0 = '        !broad_phase_build_detail::checked_accumulate(preflight_.pair_products[0], traversal_work) ||\n'
          pair1 = '        !broad_phase_build_detail::checked_accumulate(preflight_.pair_products[1], traversal_work) ||\n'
          if text.count(pair0) != 2 or text.count(pair1) != 2:
              raise SystemExit('unexpected work reservation shape')
          text = text.replace(pair0 + pair0, pair0 * 6, 1)
          text = text.replace(pair1 + pair1, pair1 * 6, 1)
          if text.count(pair0) != 6 or text.count(pair1) != 6:
              raise SystemExit('work reservation expansion failed')
          build.write_text(text)

          main = Path('tests/mesh_boolean_bounded/TestBroadPhaseMain.cc')
          text = main.read_text()
          if '#include <cfenv>\n' not in text:
              text = text.replace('#include "BroadPhaseFixtures.h"\n\n',
                                  '#include "BroadPhaseFixtures.h"\n\n#include <cfenv>\n', 1)
          marker = '  try {\n'
          setup = ('  try {\n'
                   '    if (std::fesetenv(FE_DFL_ENV) != 0 ||\n'
                   '        std::fesetround(FE_TONEAREST) != 0) {\n'
                   '      std::cerr << "unable to establish broad-phase floating environment\\n";\n'
                   '      return 2;\n'
                   '    }\n')
          if setup not in text:
              if text.count(marker) != 1:
                  raise SystemExit('test main try block not found')
              text = text.replace(marker, setup, 1)
          main.write_text(text)
          PY
          rm -f .github/workflows/component06-accounting-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --check
          git commit -m "Fix Component 06 work accounting and publication boundary"
          git push origin "HEAD:${GITHUB_REF_NAME}"
