name: Component 06 source bootstrap

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize Component 06 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component06-payload/part-* | base64 --decode > /tmp/component06.tar.gz
          tar -xzf /tmp/component06.tar.gz -C .
          rm -rf .github/component06-payload
          rm -f .github/workflows/component06-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Implement component 06 broad-phase collision enumeration (plan 06)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
