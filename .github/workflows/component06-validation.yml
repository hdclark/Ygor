name: Component 06 validation

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  gcc-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile, test, and publish transcript
        shell: bash
        run: |
          set +e
          log=.github/component06-validation.log
          : > "$log"
          echo "Component 06 validation" >> "$log"
          echo "commit=${GITHUB_SHA}" >> "$log"
          echo "runner=$(uname -a)" >> "$log"
          echo "compiler=$(g++ --version | head -1)" >> "$log"
          echo >> "$log"

          sudo apt-get update >> "$log" 2>&1
          apt_status=$?
          if [ "$apt_status" -eq 0 ]; then
            sudo apt-get install -y libeigen3-dev libgsl-dev >> "$log" 2>&1
            apt_status=$?
          fi

          configure_status=125
          build_status=125
          test_status=125
          if [ "$apt_status" -eq 0 ]; then
            echo >> "$log"
            echo "=== configure ===" >> "$log"
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DMEMORY_CONSTRAINED_BUILD=ON >> "$log" 2>&1
            configure_status=$?
          fi
          if [ "$configure_status" -eq 0 ]; then
            echo >> "$log"
            echo "=== build ===" >> "$log"
            cmake --build build --target ygor_mesh_boolean_broad_phase_tests --parallel 2 >> "$log" 2>&1
            build_status=$?
          fi
          if [ "$build_status" -eq 0 ]; then
            echo >> "$log"
            echo "=== tests ===" >> "$log"
            ctest --test-dir build --output-on-failure -V -R mesh_boolean_bounded_component06_ >> "$log" 2>&1
            test_status=$?
          fi

          echo >> "$log"
          echo "apt_status=${apt_status}" >> "$log"
          echo "configure_status=${configure_status}" >> "$log"
          echo "build_status=${build_status}" >> "$log"
          echo "test_status=${test_status}" >> "$log"

          rm -f .github/workflows/component06-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/component06-validation.log .github/workflows/component06-validation.yml
          git commit -m "Record Component 06 validation transcript"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 0
