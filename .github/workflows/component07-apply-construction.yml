name: Apply Component 07 construction registry

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan
    paths:
      - .github/component07-construction.patch.b64
      - .github/workflows/component07-apply-construction.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact plan commit
        env:
          BASE_SHA: 66d9f14e32743c95c583c330d63c7ecab5cacf46
          BRANCH_REF: refs/heads/agent/bounded-manifold-mesh-boolean-plan
        run: |
          set -euo pipefail
          if [[ ! -f .github/component07-construction.patch.b64 ]]; then
            echo "Patch payload not present yet; transport is waiting."
            exit 0
          fi
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          base64 --decode .github/component07-construction.patch.b64 \
            | gzip -dc > /tmp/component07.patch
          git apply --index --3way /tmp/component07.patch
          git rm .github/component07-construction.patch.b64 \
                 .github/workflows/component07-apply-construction.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git commit -m "Component 07: authoritative construction registry"
          echo "FINAL_SHA=$(git rev-parse HEAD)"
          git push --force-with-lease="${BRANCH_REF}:${GITHUB_SHA}" \
                   origin "HEAD:${BRANCH_REF}"
