name: Apply Component 08 bounded ordering

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited
    branches:
      - agent/component07-runner-base

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/bounded-manifold-mesh-boolean-plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component08-ordering.patch.part-* | base64 --decode | gzip --decompress > /tmp/component08-ordering.patch
          echo "e0e0a4d6f2dc43d2f8ba6638fd15c991c5387cf4cf0c7919960368c2150411f9  /tmp/component08-ordering.patch" | sha256sum --check --strict
          git apply --check /tmp/component08-ordering.patch
          git apply --index /tmp/component08-ordering.patch

      - name: Configure generated headers
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ygor-component08-build \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF

      - name: Run strict focused qualification
        shell: bash
        run: |
          set -euo pipefail
          common=(
            -std=c++17 -O2 -Wall -Wextra -Werror -pedantic
            -fno-fast-math -frounding-math -fno-associative-math
            -fno-reciprocal-math -fsigned-zeros -fno-finite-math-only
            -ffp-contract=off -DYGOR_MESH_BOOLEAN_STRICT_FP_BUILD=1
            -Isrc -I/tmp/ygor-component08-build/src
          )

          g++ "${common[@]}" \
            tests/mesh_boolean_bounded/TestBoundedCarrierOrdering.cc \
            src/YgorMeshesBooleanBounded/BoundedCarrierOrdering.cc \
            src/YgorMeshesBooleanBounded/IntersectionKeys.cc \
            src/YgorMeshesBooleanBounded/RelationKeys.cc \
            -o /tmp/ygor_component08_ordering
          /tmp/ygor_component08_ordering

          g++ "${common[@]}" \
            tests/mesh_boolean_bounded/TestSourceEdgeArrangements.cc \
            src/YgorMeshesBooleanBounded/SourceEdgeArrangements.cc \
            src/YgorMeshesBooleanBounded/BoundedCarrierOrdering.cc \
            src/YgorMeshesBooleanBounded/IntersectionKeys.cc \
            src/YgorMeshesBooleanBounded/RelationKeys.cc \
            -o /tmp/ygor_component08_source_edges
          /tmp/ygor_component08_source_edges

          g++ "${common[@]}" \
            tests/mesh_boolean_bounded/TestTransverseCarrierArrangements.cc \
            src/YgorMeshesBooleanBounded/TransverseCarrierArrangements.cc \
            src/YgorMeshesBooleanBounded/BoundedCarrierOrdering.cc \
            src/YgorMeshesBooleanBounded/IntersectionKeys.cc \
            src/YgorMeshesBooleanBounded/RelationKeys.cc \
            src/YgorMeshesBooleanBounded/Sha256.cc \
            -o /tmp/ygor_component08_transverse
          /tmp/ygor_component08_transverse

      - name: Commit validated ordering provider
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/component08-ordering.patch.part-*
          rm -f .github/component08-registry.patch.part-*
          rm -f .github/workflows/component07-apply.yml
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 08 bounded carrier ordering (plan 08)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
