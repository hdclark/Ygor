name: Apply Component 08 source topology

on:
  pull_request:
    types:
      - opened
      - synchronize
      - edited
    branches:
      - agent/component07-runner-base

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/bounded-manifold-mesh-boolean-plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/component08-source-topology-parts.sha256 <<'EOF'
          722062a22a0393587fa600ccc1d4c20aa894bf87f9ae9f5d1b62ebc4c33e1239  .github/component08-source-topology.patch.part-00
          c3b60e0e4e81143ac0a3997acf1a53b4f39292d5805070f18f9f5a33f55ca29d  .github/component08-source-topology.patch.part-01
          89f40a9f8dea6caacac491e2439e44ce94e6dd0408ed8126ca6343164a81a411  .github/component08-source-topology.patch.part-02
          0ed6ed74a661fe3ba074bdd0da67d93d535ae53d6fad3fbcf7da51260b18c21d  .github/component08-source-topology.patch.part-03
          42d4e796878fe248d6d2ea78057039a6455c41e5978a9c6adc2e90b1ee5636be  .github/component08-source-topology.patch.part-04
          a37916f4e9266a7c6c78ba5558082fedec2775496fa37156f8613e708bb51c6f  .github/component08-source-topology.patch.part-05
          9a4caf5322d096ea10526e48a50b47a0e7aedf3632508f52db035e20beb4b714  .github/component08-source-topology.patch.part-06
          EOF
          sha256sum --check --strict /tmp/component08-source-topology-parts.sha256
          cat .github/component08-source-topology.patch.part-* > /tmp/component08-source-topology.b64
          base64 --decode /tmp/component08-source-topology.b64 > /tmp/component08-source-topology.patch.gz
          echo "83ed2fba8a5e109c1434cf44d32d0a557525fc071ac86f2a14e7d746ef53bdc3  /tmp/component08-source-topology.patch.gz" | sha256sum --check --strict
          gzip --test /tmp/component08-source-topology.patch.gz
          gzip --decompress --stdout /tmp/component08-source-topology.patch.gz > /tmp/component08-source-topology.patch
          echo "67446684ace99167287080a1a765473f46b360599a9c0976b0a6c7e842c6db33  /tmp/component08-source-topology.patch" | sha256sum --check --strict
          git apply --check /tmp/component08-source-topology.patch
          git apply --index /tmp/component08-source-topology.patch

      - name: Configure strict build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ygor-component08-build \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF

      - name: Build and run focused qualification
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/ygor-component08-build --target \
            ygor_mesh_boolean_intersection_topology_descriptor_tests \
            ygor_mesh_boolean_intersection_descriptor_tests \
            ygor_mesh_boolean_intersection_aggregation_tests \
            ygor_mesh_boolean_intersection_incidence_tests \
            ygor_mesh_boolean_source_edge_arrangement_tests \
            ygor_mesh_boolean_transverse_carrier_arrangement_tests \
            ygor_mesh_boolean_coplanar_carrier_arrangement_tests \
            ygor_mesh_boolean_bounded_carrier_ordering_tests \
            -j2
          ctest --test-dir /tmp/ygor-component08-build --output-on-failure \
            -R 'mesh_boolean_bounded_component08_(topology_descriptors|descriptors|aggregation|incidence|source_edge_arrangements|transverse_carriers|coplanar_arrangements|bounded_ordering)$'

      - name: Commit validated source topology
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/component08-source-topology.patch.part-*
          rm -f .github/workflows/component07-apply.yml
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 08 source-topology descriptors (plan 08)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
