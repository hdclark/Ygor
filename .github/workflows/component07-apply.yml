name: Apply Component 08 codec

on:
  pull_request:
    types: [opened, synchronize, edited]
    branches: [agent/component07-runner-base]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/bounded-manifold-mesh-boolean-plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Verify and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component08-codec.patch.part-* > /tmp/component08-codec.b64
          echo "72f5b10a2c9ebc779a2bd3cb797825a370a367808a655d51b810263e83ab9fd6  /tmp/component08-codec.b64" | sha256sum --check --strict
          base64 --decode /tmp/component08-codec.b64 > /tmp/component08-codec.patch.gz
          echo "764508c79544614b04a944e3c2f3c2406fab3053cb63f056df32a0f3c9ac88a0  /tmp/component08-codec.patch.gz" | sha256sum --check --strict
          gzip --test /tmp/component08-codec.patch.gz
          gzip --decompress --stdout /tmp/component08-codec.patch.gz > /tmp/component08-codec.patch
          echo "14a985c12a18e5b13aeeeca8d900d1d1e1ad2f1547f5ea61ad92ec972cd9009e  /tmp/component08-codec.patch" | sha256sum --check --strict
          git apply --check /tmp/component08-codec.patch
          git apply --index /tmp/component08-codec.patch

      - name: Configure strict build
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ygor-component08-build \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF

      - name: Build and run focused qualification
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/ygor-component08-build --target \
            ygor_mesh_boolean_intersection_codec_tests \
            ygor_mesh_boolean_intersection_canonicalization_tests \
            ygor_mesh_boolean_intersection_topology_descriptor_tests \
            ygor_mesh_boolean_intersection_descriptor_tests \
            ygor_mesh_boolean_intersection_aggregation_tests \
            ygor_mesh_boolean_intersection_incidence_tests \
            ygor_mesh_boolean_source_edge_arrangement_tests \
            ygor_mesh_boolean_transverse_carrier_arrangement_tests \
            ygor_mesh_boolean_coplanar_carrier_arrangement_tests \
            ygor_mesh_boolean_bounded_carrier_ordering_tests \
            -j2
          ctest --test-dir /tmp/ygor-component08-build --output-on-failure \
            -R 'mesh_boolean_bounded_component08_(codec|canonicalization|topology_descriptors|descriptors|aggregation|incidence|source_edge_arrangements|transverse_carriers|coplanar_arrangements|bounded_ordering)$'

      - name: Commit validated codec
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/component08-codec.patch.part-*
          rm -f .github/workflows/component07-apply.yml
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 08 canonical codec and private decode (plan 08)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
