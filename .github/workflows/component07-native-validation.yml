name: Component 07 native validation

on:
  workflow_run:
    workflows:
      - Mesh Boolean P0 contracts
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    if: github.event.workflow_run.id == 30037737976
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hdclark/Ygor
          fetch-depth: 0
          ref: 6de6e6e3e74ac4c3a57bfc7f6acdbb7b5c76a5f8

      - name: Verify published Component 07 commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6de6e6e3e74ac4c3a57bfc7f6acdbb7b5c76a5f8"
          test "$(git hash-object component_07_implementation_status.md)" = "b5ab10d12c0eb8616520a07cfe889d1797a8c67d"
          test "$(git hash-object src/YgorMeshesBooleanBounded/ContractVersions.h)" = "a3ad9272b2b6d2fb2fdd21f07a0aeea79dfc5bec"
          test "$(git hash-object src/YgorMeshesBooleanBounded/CoplanarRelationOverlay.h)" = "9ff07b6940dcb3243e81c3822ad8f6bb0a72b8c7"
          test "$(git hash-object tests/mesh_boolean_bounded/TestCoplanarRelationOverlay.cc)" = "d9b24b4bf3260194b5a472c930825f16484b5f98"
          test "$(git hash-object tracker.md)" = "cb2b0cff862103c075a42d28c3ac0775b9e119e4"
          git diff-tree --check HEAD^

      - name: Configure dependency-minimal strict test build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ygor-component07-focused
          python3 - <<'PY'
          from pathlib import Path
          repo = Path.cwd()
          source_cmake = (repo / "src/YgorMeshesBooleanBounded/CMakeLists.txt").read_text()
          start = source_cmake.index("add_library(ygor_mesh_boolean_bounded_strict")
          end = source_cmake.index(
              "set_property(TARGET ygor_mesh_boolean_bounded_strict", start)
          block = source_cmake[start:end]
          files = []
          for line in block.splitlines()[1:]:
              value = line.strip()
              if not value:
                  continue
              if value.endswith(")"):
                  value = value[:-1]
                  if value:
                      files.append(value)
                  break
              files.append(value)
          output = '''cmake_minimum_required(VERSION 3.16)
          project(YgorComponent07Focused LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(Threads REQUIRED)
          function(strict target)
            target_compile_definitions(${target} PRIVATE YGOR_MESH_BOOLEAN_STRICT_FP_BUILD=1)
            if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
              target_compile_options(${target} PRIVATE
                -fno-fast-math -frounding-math -fno-associative-math
                -fno-reciprocal-math -fsigned-zeros -fno-finite-math-only
                -ffp-contract=off)
            elseif(CMAKE_CXX_COMPILER_ID MATCHES "Clang")
              target_compile_options(${target} PRIVATE
                -fno-fast-math -frounding-math -fsigned-zeros -ffp-contract=off)
            else()
              message(FATAL_ERROR "Unqualified strict floating profile")
            endif()
          endfunction()
          set(REPO $ENV{GITHUB_WORKSPACE})
          configure_file(${REPO}/src/YgorDefinitions.h.in
                         ${CMAKE_BINARY_DIR}/YgorDefinitions.h)
          add_library(core
            ${REPO}/src/YgorMeshesExactFloatExpansionCore.cc
            ${REPO}/src/YgorMeshesAdaptivePredicates.cc)
          target_include_directories(core PUBLIC ${REPO}/src ${CMAKE_BINARY_DIR})
          strict(core)
          add_library(strictlib
          '''
          for filename in files:
              output += f"  ${{REPO}}/src/YgorMeshesBooleanBounded/{filename}\n"
          output += ''')
          target_include_directories(strictlib PUBLIC ${REPO}/src ${CMAKE_BINARY_DIR})
          target_link_libraries(strictlib PUBLIC core)
          strict(strictlib)

          function(component07_test target)
            add_executable(${target} ${ARGN})
            target_include_directories(${target} PRIVATE
              ${REPO}/src ${CMAKE_BINARY_DIR}
              ${REPO}/tests/mesh_boolean_bounded)
            target_link_libraries(${target} PRIVATE strictlib Threads::Threads)
            strict(${target})
          endfunction()

          component07_test(candidate_edge
            ${REPO}/tests/mesh_boolean_bounded/TestCandidateSourceEdgeRelations.cc
            ${REPO}/tests/mesh_boolean_bounded/BroadPhaseFixtures.cc
            ${REPO}/tests/mesh_boolean_bounded/MinimalPublicMeshCarriers.cc
            ${REPO}/src/YgorMeshesBooleanBounded/Cancellation.cc)
          component07_test(edge_facet
            ${REPO}/tests/mesh_boolean_bounded/TestEdgeFacetKernel.cc
            ${REPO}/src/YgorMeshesBooleanBounded/Cancellation.cc)
          component07_test(edge_facet_integration
            ${REPO}/tests/mesh_boolean_bounded/TestEdgeFacetRelations.cc
            ${REPO}/tests/mesh_boolean_bounded/BroadPhaseFixtures.cc
            ${REPO}/tests/mesh_boolean_bounded/MinimalPublicMeshCarriers.cc
            ${REPO}/src/YgorMeshesBooleanBounded/Cancellation.cc)
          component07_test(facet_facet
            ${REPO}/tests/mesh_boolean_bounded/TestFacetFacetKernel.cc
            ${REPO}/src/YgorMeshesBooleanBounded/Cancellation.cc)
          component07_test(coplanar
            ${REPO}/tests/mesh_boolean_bounded/TestCoplanarRelationOverlay.cc
            ${REPO}/src/YgorMeshesBooleanBounded/Cancellation.cc)
          '''
          Path("/tmp/ygor-component07-focused/CMakeLists.txt").write_text(output)
          PY
          cmake -S /tmp/ygor-component07-focused \
                -B /tmp/ygor-component07-focused/build \
                -DCMAKE_BUILD_TYPE=Debug

      - name: Build and run focused Component 07 chain
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/ygor-component07-focused/build -j2 \
            --target candidate_edge edge_facet edge_facet_integration facet_facet coplanar
          for test in candidate_edge edge_facet edge_facet_integration facet_facet coplanar; do
            "/tmp/ygor-component07-focused/build/${test}"
          done

      - name: Record validation pass
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 90 --repo hdclark/Ygor --body "Native strict C++17 validation passed for Component 07 commit \`6de6e6e3e74ac4c3a57bfc7f6acdbb7b5c76a5f8\`. Verified all five exact post-image blobs and successfully built and ran \`candidate_edge\`, \`edge_facet\`, \`edge_facet_integration\`, \`facet_facet\`, and \`coplanar\`. Workflow run: https://github.com/hdclark/Ygor/actions/runs/${GITHUB_RUN_ID}."

      - name: Record validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 90 --repo hdclark/Ygor --body "Native strict C++17 validation failed for Component 07 commit \`6de6e6e3e74ac4c3a57bfc7f6acdbb7b5c76a5f8\`. Inspect workflow run: https://github.com/hdclark/Ygor/actions/runs/${GITHUB_RUN_ID}."
