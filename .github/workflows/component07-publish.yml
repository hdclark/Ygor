name: Component 07 publish completion

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified Component 07 commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          : > /tmp/component07.patch.b64
          for blob in \
            311a99ae9045be7274415ecc1d5e5129a7920b7a \
            2b9c49087ec54d7aaea18a19520cd3e0de8f5349 \
            0120aa6406650235acf951bca279a2dba763eba1
          do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" \
              | python3 -c 'import base64,json,sys; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["content"]).decode("ascii"))' \
              >> /tmp/component07.patch.b64
          done

          test "$(sha256sum /tmp/component07.patch.b64 | cut -d' ' -f1)" = "684567c90f2655087af0df1f8b837bdf687e687458440f09551612c360609aae"
          base64 --decode /tmp/component07.patch.b64 > /tmp/component07.patch.gz
          test "$(sha256sum /tmp/component07.patch.gz | cut -d' ' -f1)" = "3590d792755fed478c890841dc84667710f76a05745ff0e50802fb69ba80080c"
          gzip --decompress --stdout /tmp/component07.patch.gz > /tmp/component07.patch
          test "$(sha256sum /tmp/component07.patch | cut -d' ' -f1)" = "f22c14156a05cae915a5755c854ff7a93f4dd202e3d967b91e48b00eb3303fd7"

          git apply --check /tmp/component07.patch
          git apply --index /tmp/component07.patch
          git rm .github/workflows/component07-publish.yml
          git diff --cached --check

          expected_tree=a3566b705aa2b9a7767f11bec8c504cebc3ad4ef
          actual_tree=$(git write-tree)
          test "${actual_tree}" = "${expected_tree}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Component 07: complete replay and qualification"
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
