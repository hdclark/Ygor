name: Temporary Component 07 runner

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/component07-scheduled-runner.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: component07-coplanar-event-topology
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hdclark/Ygor
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Execute reviewed Component 07 workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/component07-workspace.yml')
          lines = source.read_text().splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.lstrip() == 'run: |':
                  indent = len(line) - len(line.lstrip())
                  index += 1
                  body = []
                  while index < len(lines):
                      candidate = lines[index]
                      if candidate.strip():
                          candidate_indent = len(candidate) - len(candidate.lstrip())
                          if candidate_indent <= indent:
                              break
                          body.append(candidate[indent + 2:])
                      else:
                          body.append('')
                      index += 1
                  blocks.append('\n'.join(body) + '\n')
                  continue
              index += 1

          if len(blocks) != 4:
              raise SystemExit(
                  f'expected 4 reviewed run blocks, found {len(blocks)}')
          for ordinal, body in enumerate(blocks):
              path = Path(f'/tmp/component07-reviewed-block-{ordinal}.sh')
              path.write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + body)
              path.chmod(0o700)
          PY

          for block in /tmp/component07-reviewed-block-*.sh; do
            "$block"
          done
