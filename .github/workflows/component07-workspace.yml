name: Component 07 workspace export

on:
  pull_request:
    branches:
      - master
      - agent/component07-runner-base
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0
      - name: Audit staged Component 08 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .component08-verifier-patch/chunk-* > /tmp/component08-verifier.patch
          sha256sum /tmp/component08-verifier.patch
          wc -c /tmp/component08-verifier.patch
          git show fabcb8336cc5fa977ef26801c772a034d60ce72e:.github/workflows/component07-workspace.yml > .github/workflows/component07-workspace.yml
          git show a025c81d0fd24ccf907294e74411c8ff6c28129c:.github/workflows/component08-workspace-export.yml > .github/workflows/component08-workspace-export.yml
          git apply --check /tmp/component08-verifier.patch
          echo 'PATCH_APPLY_CHECK_OK'
          exit 1
