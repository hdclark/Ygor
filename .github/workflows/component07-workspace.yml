name: Apply Component 07 coplanar boundary partitions

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bounded-manifold-mesh-boolean-plan
          fetch-depth: 0
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component07-boundary-partitions.patch.part-* | base64 -d | gzip -d > /tmp/component07-boundary-partitions.patch
          echo "0b0906a1e1cea9d723a7ab9e0968a5d304a3f72d105d7feafcc2d311891fb8d2  /tmp/component07-boundary-partitions.patch" | sha256sum -c -
          git apply --check /tmp/component07-boundary-partitions.patch
          git apply --index /tmp/component07-boundary-partitions.patch
      - name: Build focused strict targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DWITH_EIGEN=OFF -DWITH_GNU_GSL=OFF
          cmake --build build --target \
            ygor_mesh_boolean_candidate_source_edge_relation_tests \
            ygor_mesh_boolean_edge_facet_relation_tests \
            ygor_mesh_boolean_facet_facet_relation_tests \
            ygor_mesh_boolean_coplanar_overlay_tests \
            ygor_mesh_boolean_edge_facet_integration_runtime_tests -j1
      - name: Run focused strict tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure -R 'mesh_boolean_bounded_component07_(candidate_source_edge_relations|edge_facet_relations|edge_facet_integration|facet_facet_relations|coplanar_overlay)'
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/component07-boundary-partitions.patch.part-*
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 07 coplanar boundary partitions'
          git push
