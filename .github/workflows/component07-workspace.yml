name: Component 07 workspace export

on:
  pull_request:
    branches:
      - master
      - agent/component07-runner-base
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queued Component 07 patch series
        if: ${{ github.event_name == 'push' && hashFiles('.github/component07-series.ready') != '' }}
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          cat .github/component07-patch-b64/part-* > /tmp/component07-series.patch.gz.b64
          test "$(sha256sum /tmp/component07-series.patch.gz.b64 | cut -d' ' -f1)" = "842057939a9584cdd000e9e778e8d4301e015798b37333c02cf922952bcb8f0c"
          base64 --decode /tmp/component07-series.patch.gz.b64 | gzip --decompress > /tmp/component07-series.patch
          test "$(sha256sum /tmp/component07-series.patch | cut -d' ' -f1)" = "28b3b1ca0edd3e7945d8727ecb740f045a84d8eb53d93dabfae9a4cc6d71eb0c"
          git am --3way /tmp/component07-series.patch
          git rm -r .github/component07-patch-b64 .github/component07-series.ready
          git commit -m "Component 07: remove applied topology patch bundle"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Package checkout
        run: |
          git status --short --branch
          tar --exclude=.git --exclude=build -czf /tmp/ygor-component07-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-component07-workspace
          path: /tmp/ygor-component07-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
