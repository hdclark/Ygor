name: Apply Component 07 facet-facet support patch

on:
  pull_request:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan
      - name: Verify, apply, and publish commit
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component07-facet-facet.patch.part-* | base64 -d | gzip -d > /tmp/component07-facet-facet.mbox
          echo "3677eb32ec0f8c372eaefdd8ae71af72223c02d7e2baea53e40fd2f952dde2be  /tmp/component07-facet-facet.mbox" | sha256sum -c -
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git am /tmp/component07-facet-facet.mbox
          rm .github/component07-facet-facet.patch.part-*
          git add -u
          git commit -m 'Remove staged Component 07 facet-facet patch'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
