name: Component 07 workspace export

on:
  pull_request:
    branches:
      - master
      - agent/component07-runner-base
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queued Component 07 patch series
        if: ${{ github.event_name == 'push' && hashFiles('.github/component07-series.patch.gz.b64') != '' }}
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          base64 --decode .github/component07-series.patch.gz.b64 | gzip --decompress > /tmp/component07-series.patch
          git am --3way /tmp/component07-series.patch
          git rm .github/component07-series.patch.gz.b64
          git commit -m "Component 07: remove applied patch bundle"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Package checkout
        run: |
          git status --short --branch
          tar --exclude=.git --exclude=build -czf /tmp/ygor-component07-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-component07-workspace
          path: /tmp/ygor-component07-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
