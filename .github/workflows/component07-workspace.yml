name: Apply Component 07 source-edge/source-facet patch

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan
  pull_request:
    branches:
      - master
    types:
      - edited

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan
      - name: Verify, apply, commit, and restore
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component07.patch.part-* | base64 -d | gzip -d > /tmp/component07.patch
          echo "e63e3c9f46272a9cce47e661d3d032e2d14be39003e72f04109f27f6dd4402e7  /tmp/component07.patch" | sha256sum -c -
          if ! git apply --index /tmp/component07.patch 2>/tmp/component07-apply-direct.log; then
            git reset --hard HEAD
            if ! git apply --3way --index /tmp/component07.patch 2>/tmp/component07-apply-three-way.log; then
              {
                echo '# Component 07 prepared patch application failure'
                echo
                echo '## Patch manifest'
                grep '^diff --git ' /tmp/component07.patch || true
                echo
                echo '## Direct apply'
                cat /tmp/component07-apply-direct.log
                echo
                echo '## Three-way apply'
                cat /tmp/component07-apply-three-way.log
              } > .github/component07-apply-failure.log
              git add .github/component07-apply-failure.log
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Record Component 07 patch application failure'
              git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
              exit 1
            fi
          fi
          rm .github/component07.patch.part-*
          rm -f .github/component07-apply-failure.log
          cat > .github/workflows/component07-workspace.yml <<'YAML'
          name: Component 07 workspace export

          on:
            pull_request:
              branches:
                - master
            push:
              branches:
                - agent/bounded-manifold-mesh-boolean-plan

          jobs:
            export:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Package checkout
                  run: |
                    git status --short --branch
                    tar --exclude=.git --exclude=build -czf /tmp/ygor-component07-workspace.tar.gz .
                - uses: actions/upload-artifact@v4
                  with:
                    name: ygor-component07-workspace
                    path: /tmp/ygor-component07-workspace.tar.gz
                    if-no-files-found: error
                    retention-days: 1
          YAML
          git add .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 07 source-edge/source-facet relations'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
