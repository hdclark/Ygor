name: Component 07 workspace export

on:
  pull_request:
    branches:
      - master
      - agent/component07-runner-base
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply queued Component 07 implementation series
        if: ${{ github.event_name == 'push' }}
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          cat .github/component07-patch-b64/part-* > /tmp/component07-series.patch.gz.b64
          test "$(sha256sum /tmp/component07-series.patch.gz.b64 | cut -d' ' -f1)" = "0b8964f71fd3fdf14411a2d22055e8e387d3eaeb5794b399d1547b7ed7948a43"
          base64 --decode /tmp/component07-series.patch.gz.b64 | gzip --decompress > /tmp/component07-series.patch
          test "$(sha256sum /tmp/component07-series.patch | cut -d' ' -f1)" = "50af3dee3845e9c1e18e9bd1d9928caa0f93869864de94af4bd9c51d768f9611"
          git am --3way /tmp/component07-series.patch
          git rm -r .github/component07-patch-b64 .github/component07-series.ready
          printf '%s' '' | base64 --decode > .github/workflows/component07-workspace.yml
          git add .github/workflows/component07-workspace.yml
          git commit -m "Component 07: remove applied implementation bundle"
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Package checkout
        run: |
          git status --short --branch
          tar --exclude=.git --exclude=build -czf /tmp/ygor-component07-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-component07-workspace
          path: /tmp/ygor-component07-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
