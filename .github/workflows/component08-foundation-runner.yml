name: Component 08 through conceptual events runner

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: component08-through-events
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: hdclark/Ygor
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Check whether the Component 08 patch remains pending
        id: pending
        shell: bash
        run: |
          if compgen -G '.github/component08-registry.patch.part-*' > /dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply exact patch
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component08-registry.patch.part-* \
            | base64 --decode | gzip --decompress \
            > /tmp/component08-through-events.patch
          echo "f0d8bda05c47c67c5b7a0609737f5244d32249324fdc1a8219c4be742a590f69  /tmp/component08-through-events.patch" \
            | sha256sum --check --strict
          git apply --check \
            --exclude='.github/component08-registry.patch.part-00' \
            /tmp/component08-through-events.patch
          git apply --index \
            --exclude='.github/component08-registry.patch.part-00' \
            /tmp/component08-through-events.patch
          git diff --check --cached

      - name: Configure strict build
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ygor-component08-build \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF

      - name: Build and run focused qualification
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/ygor-component08-build \
            --target \
              ygor_mesh_boolean_intersection_foundation_tests \
              ygor_mesh_boolean_intersection_empty_tests \
              ygor_mesh_boolean_intersection_event_tests \
            --parallel 2
          ctest --test-dir /tmp/ygor-component08-build \
            --output-on-failure \
            -R 'mesh_boolean_bounded_component08_(foundation|empty|events)'

      - name: Commit validated source to PR 90
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/component08-registry.patch.part-*
          rm -f .github/workflows/component08-apply.yml
          git add .
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 08 through conceptual event interning (plan 08)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component08-through-events-failure
          path: |
            /tmp/component08-through-events.patch
            /tmp/ygor-component08-build/Testing/Temporary/LastTest.log
            /tmp/ygor-component08-build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 3
