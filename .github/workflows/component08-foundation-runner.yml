name: Component 08 coplanar carrier publisher

on:
  workflow_run:
    workflows:
      - Component 07 workspace export
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: component08-coplanar-carrier-publisher
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    if: github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: hdclark/Ygor
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Check pending coplanar carrier patch
        id: pending
        shell: bash
        run: |
          run=true
          for part in 00 01 02 03 04; do
            test -f ".github/component08-coplanar.patch.part-${part}" || run=false
          done
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      - name: Verify and apply exact coplanar carrier patch
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component08-coplanar.patch.part-* \
            | base64 --decode | gzip --decompress \
            > /tmp/component08-coplanar.patch
          echo "d38f7f4af36e7496fd0bad17cdd9bf39223c9c344c37f70222e20427506483ef  /tmp/component08-coplanar.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/component08-coplanar.patch
          git apply --index /tmp/component08-coplanar.patch
          git diff --check --cached

      - name: Configure strict build
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ygor-component08-build \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF

      - name: Build and run Component 08 qualification
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/ygor-component08-build \
            --target \
              ygor_mesh_boolean_intersection_key_tests \
              ygor_mesh_boolean_intersection_interning_tests \
              ygor_mesh_boolean_intersection_preflight_tests \
              ygor_mesh_boolean_intersection_coordinate_tests \
              ygor_mesh_boolean_intersection_incidence_tests \
              ygor_mesh_boolean_source_edge_arrangement_tests \
              ygor_mesh_boolean_transverse_carrier_arrangement_tests \
              ygor_mesh_boolean_coplanar_carrier_arrangement_tests \
            --parallel 2
          ctest --test-dir /tmp/ygor-component08-build \
            --output-on-failure \
            -R 'mesh_boolean_bounded_component08_(keys|interning|preflight|coordinates|incidence|source_edge_arrangements|transverse_carriers|coplanar_arrangements)'

      - name: Commit validated coplanar carriers to PR 90
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/component08-coplanar.patch.part-*
          git add .
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 08 coplanar carrier arrangements (plan 08)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component08-coplanar-carrier-failure
          path: |
            /tmp/component08-coplanar.patch
            /tmp/ygor-component08-build/Testing/Temporary/LastTest.log
            /tmp/ygor-component08-build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 3
