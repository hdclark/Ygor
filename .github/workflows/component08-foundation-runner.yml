name: Component 08 direct-source foundation runner

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: component08-direct-source-foundation
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: hdclark/Ygor
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Check pending payload
        id: pending
        shell: bash
        run: |
          if test -f .github/component08-foundation-source.patch.b64; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply exact source patch
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/component08-foundation-source.patch.b64 \
            | gzip --decompress > /tmp/component08-foundation-source.patch
          echo "b51d981f7c0054b937507f75344ac4ab87b4dd4799cde288c9d7fb032ad4f10d  /tmp/component08-foundation-source.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/component08-foundation-source.patch
          git apply --index /tmp/component08-foundation-source.patch
          git diff --check --cached

      - name: Configure generated headers
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ygor-component08-build \
            -DBUILD_TESTING=OFF \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF

      - name: Run strict key qualification
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -fno-fast-math -frounding-math -fno-associative-math \
            -fno-reciprocal-math -fsigned-zeros -fno-finite-math-only \
            -ffp-contract=off -DYGOR_MESH_BOOLEAN_STRICT_FP_BUILD=1 \
            -Isrc -I/tmp/ygor-component08-build/src \
            src/YgorMeshesBooleanBounded/RelationKeys.cc \
            src/YgorMeshesBooleanBounded/IntersectionKeys.cc \
            tests/mesh_boolean_bounded/TestIntersectionKeys.cc \
            -o /tmp/ygor-component08-keys
          /tmp/ygor-component08-keys

      - name: Commit validated foundation
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/component08-foundation-source.patch.b64
          rm -f .github/component08-registry.patch.part-*
          rm -f .github/component08-events.patch.part-*
          rm -f .github/component08-binding-order.patch.part-*
          rm -f .github/workflows/component08-apply.yml
          git add .
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Component 08 registry contract foundation (plan 08)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component08-direct-source-foundation-failure
          path: |
            /tmp/component08-foundation-source.patch
            /tmp/ygor-component08-build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 3
