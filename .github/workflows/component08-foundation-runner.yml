name: Component 08 reciprocal incidence publisher

on:
  workflow_run:
    workflows:
      - Component 07 workspace export
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: component08-incidence-publisher
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    if: github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: hdclark/Ygor
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Check pending incidence patch
        id: pending
        shell: bash
        run: |
          if test -f .github/component08-incidence.patch.part-00 && \
             test -f .github/component08-incidence.patch.part-01; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply exact incidence patch
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/component08-incidence.patch.part-* \
            | base64 --decode | gzip --decompress \
            > /tmp/component08-incidence.patch
          echo "0d318228876b3a18c324e4367bafb757a3fe30937730fb2a9bc8a37dfdadc81e  /tmp/component08-incidence.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/component08-incidence.patch
          git apply --index /tmp/component08-incidence.patch
          git diff --check --cached

      - name: Configure strict build
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ygor-component08-build \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF

      - name: Build and run Component 08 qualification
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/ygor-component08-build \
            --target \
              ygor_mesh_boolean_intersection_key_tests \
              ygor_mesh_boolean_intersection_interning_tests \
              ygor_mesh_boolean_intersection_preflight_tests \
              ygor_mesh_boolean_intersection_coordinate_tests \
              ygor_mesh_boolean_intersection_incidence_tests \
            --parallel 2
          ctest --test-dir /tmp/ygor-component08-build \
            --output-on-failure \
            -R 'mesh_boolean_bounded_component08_(keys|interning|preflight|coordinates|incidence)'

      - name: Commit validated incidence to PR 90
        if: steps.pending.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/component08-incidence.patch.part-*
          git add .
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Component 08 reciprocal event incidence (plan 08)'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component08-incidence-failure
          path: |
            /tmp/component08-incidence.patch
            /tmp/ygor-component08-build/Testing/Temporary/LastTest.log
            /tmp/ygor-component08-build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 3
