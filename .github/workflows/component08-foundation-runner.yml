name: Component 08 current workspace export

on:
  workflow_run:
    workflows:
      - Component 07 workspace export
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: component08-current-workspace-export
  cancel-in-progress: true

jobs:
  export:
    if: github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          repository: hdclark/Ygor
          fetch-depth: 0
          ref: agent/bounded-manifold-mesh-boolean-plan

      - name: Package exact checkout
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/component08-head.txt
          test "$(cat /tmp/component08-head.txt)" = "$(git rev-parse refs/remotes/origin/agent/bounded-manifold-mesh-boolean-plan)"
          tar --exclude=.git --exclude=build -czf /tmp/ygor-component08-current.tar.gz .

      - name: Upload exact checkout
        uses: actions/upload-artifact@v4
        with:
          name: ygor-component08-current-workspace
          path: |
            /tmp/ygor-component08-current.tar.gz
            /tmp/component08-head.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish retrieval marker
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/component08-current-workspace-run.txt <<MARKER
          run_id=${GITHUB_RUN_ID}
          artifact=ygor-component08-current-workspace
          checkout_head=$(cat /tmp/component08-head.txt)
          MARKER
          git add .github/component08-current-workspace-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Component 08 workspace export run'
          git push origin HEAD:agent/bounded-manifold-mesh-boolean-plan
