name: Component 08 temporary workspace export

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: read
  issues: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package clean checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=.component08-workspace-export -czf /tmp/ygor-component08-workspace.tar.gz .
          sha256sum /tmp/ygor-component08-workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-component08-workspace
          path: /tmp/ygor-component08-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Publish run identifier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/90/comments" \
            -f body="Component 08 workspace artifact ready from run ${GITHUB_RUN_ID} at commit ${GITHUB_SHA}."
