name: Component 08 temporary workspace export

on:
  push:
    branches:
      - agent/bounded-manifold-mesh-boolean-plan

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package clean checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=.component08-workspace-export -czf /tmp/ygor-component08-workspace.tar.gz .
          sha256sum /tmp/ygor-component08-workspace.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-component08-workspace
          path: /tmp/ygor-component08-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Publish run identifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .component08-workspace-export
          printf '%s\n' "${GITHUB_RUN_ID}" > .component08-workspace-export/artifact-run-id
          printf '%s\n' "${GITHUB_SHA}" > .component08-workspace-export/artifact-head-sha
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .component08-workspace-export/artifact-run-id .component08-workspace-export/artifact-head-sha
          git commit -m 'Record Component 08 workspace artifact run'
          git push
