name: Apply Plan 16 P6.1

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/export-component-workspace.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boolean_symbolic
          fetch-depth: 0
      - name: Apply and publish component commit
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/export-component-workspace.yml <<'EXPECTED_WORKFLOW'
          name: Export component workspace

          on:
            push:
              branches:
                - boolean_symbolic
              paths:
                - '.github/workflows/export-component-workspace.yml'

          permissions:
            contents: read

          jobs:
            export:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Upload source checkout
                  uses: actions/upload-artifact@v4
                  with:
                    name: ygor-boolean-symbolic-source
                    path: .
                    include-hidden-files: true
                    compression-level: 6
                    retention-days: 1
          EXPECTED_WORKFLOW
          cat .github/p6-bootstrap/chunk00 \
              .github/p6-bootstrap/chunk01 \
              .github/p6-bootstrap/chunk02 \
              .github/p6-bootstrap/chunk03 \
              .github/p6-bootstrap/chunk04 \
              | base64 --decode | gzip --decompress > /tmp/p6-1.patch
          git apply --check /tmp/p6-1.patch
          git apply /tmp/p6-1.patch
          rm -rf .github/p6-bootstrap
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Plan 16 P6.1: add qualification evidence schemas'
          git push origin HEAD:boolean_symbolic
