name: Export component workspace

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/export-component-workspace.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source checkout
        uses: actions/upload-artifact@v4
        with:
          name: ygor-boolean-symbolic-source
          path: .
          include-hidden-files: true
          compression-level: 6
          retention-days: 1
