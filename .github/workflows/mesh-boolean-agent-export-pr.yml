name: Mesh Boolean agent branch export PR

on:
  pull_request:
    paths:
      - '.github/workflows/mesh-boolean-agent-export-pr.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive branch checkout
        shell: bash
        run: tar --exclude=.git -czf Ygor-boolean_symbolic.tar.gz .
      - name: Upload branch checkout
        uses: actions/upload-artifact@v4
        with:
          name: Ygor-boolean_symbolic-source-pr
          path: Ygor-boolean_symbolic.tar.gz
          if-no-files-found: error
          retention-days: 1
