name: Mesh Boolean P4 adapters

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanBackend*'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanBackendAdapters.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p4.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanBackend*'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanBackendAdapters.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p4.yml'

permissions:
  contents: write

jobs:
  apply-staged-core:
    if: github.event_name == 'push' && github.event.head_commit.message == 'P4: stage common backend boundary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and commit the validated core patch
        env:
          P4_CORE_PATCH: 
        run: |
          printf '%s' "$P4_CORE_PATCH" | base64 --decode | gzip --decompress > /tmp/p4-core.patch
          git apply --index /tmp/p4-core.patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'P4: add common backend adapter boundary'
          git push

  backend-adapters:
    if: github.event_name != 'push' || github.event.head_commit.message != 'P4: stage common backend boundary'
    name: ${{ matrix.compiler }} backend adapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Upload bootstrap source snapshot
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: p4-source-snapshot
          path: .
          retention-days: 1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p4 -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P4 targets
        run: >-
          cmake --build build-p4
          --target Test_MeshesBooleanProductContract Test_MeshesBooleanExactResult
          --parallel 2
      - name: Run P4 prerequisites
        run: >-
          ctest --test-dir build-p4 --output-on-failure
          -R '^(MeshesBooleanProductContract|MeshBooleanExactResult.Unit)$'
          --timeout 360
