name: Mesh Boolean P4 adapters

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanBackend*'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/YgorMeshesBooleanQualification*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanBackend.cc'
      - 'tests/Test_MeshesBooleanQualificationSchemas.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'docs/MeshBooleanBackendAdapters.md'
      - 'docs/MeshBooleanQualification.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p4.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanBackend*'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/YgorMeshesBooleanQualification*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanBackend.cc'
      - 'tests/Test_MeshesBooleanQualificationSchemas.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'docs/MeshBooleanBackendAdapters.md'
      - 'docs/MeshBooleanQualification.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p4.yml'

permissions:
  contents: write

jobs:
  publish-p6-1:
    name: Publish Plan 16 P6.1
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boolean_symbolic
          fetch-depth: 0
      - name: Publish code, tests, documentation, and tracker
        shell: bash
        run: |
          set -euxo pipefail
          cat .github/p6-bootstrap/chunk00 \
              .github/p6-bootstrap/chunk01 \
              .github/p6-bootstrap/chunk02 \
              .github/p6-bootstrap/chunk03 \
              .github/p6-bootstrap/chunk04 \
              > /tmp/p6-1.patch.gz.b64
          echo '4643ba8a462e930558cb67a8dc4ae081241f637b2ea2611e553ed1f16c29b1e9  /tmp/p6-1.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/p6-1.patch.gz.b64 | gzip --decompress > /tmp/p6-1.patch
          echo '60c8c72c5b15a1c24ca4e84db4ef788fbdde1d7e4c5ec9ef864b29c5598cdbe9  /tmp/p6-1.patch' | sha256sum --check
          git apply --check --exclude='.github/workflows/*' /tmp/p6-1.patch
          git apply --exclude='.github/workflows/*' /tmp/p6-1.patch
          rm -rf .github/p6-bootstrap
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Plan 16 P6.1: add qualification evidence schemas'
          git push origin HEAD:boolean_symbolic

  backend-adapters:
    name: ${{ matrix.compiler }} backend adapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p4 -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P4 targets
        run: >-
          cmake --build build-p4
          --target Test_MeshesBooleanProductContract Test_MeshesBooleanExactResult Test_MeshesBooleanBackend
          --parallel 2
      - name: Run P4 adapter and contract tests
        run: >-
          ctest --test-dir build-p4 --output-on-failure
          -R '^(MeshesBooleanProductContract|MeshBooleanExactResult.Unit|MeshBooleanBackend.Unit)$'
          --timeout 360
