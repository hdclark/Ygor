name: Mesh Boolean P4 adapters

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanBackend*'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanBackend.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'docs/MeshBooleanBackendAdapters.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p4.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanBackend*'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanBackend.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'docs/MeshBooleanBackendAdapters.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p4.yml'

permissions:
  contents: write

jobs:
  apply-p4-fail-closed-verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Enforce adapter verifier outcomes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count == 0 and new in text:
                  return
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/YgorMeshesBooleanBackendAdapters.inc",
              '''  auto verified = entry.adapter->verify(request, attempt.value());
          if (!verified.has_value())
            return verified.error();
          return attempt.value();
          ''',
              '''  auto verified = entry.adapter->verify(request, attempt.value());
          if (!verified.has_value()) {
            auto failure = verified.error();
            if (!failure.backend)
              failure.backend = entry.identity;
            return failure;
          }
          if (!verified.value()) {
            auto failure = error(product_error_code::verifier_disagreement,
                                 "backend.adapter_verification_false");
            failure.backend = entry.identity;
            return failure;
          }
          return attempt.value();
          ''')

          replace_once(
              "tests/Test_MeshesBooleanBackend.cc",
              '''};

          class corrupting_reference_backend final
              : public boolean_backend<coordinate_type, index_type> {
          ''',
              '''};

          class false_verifying_backend final
              : public boolean_backend<coordinate_type, index_type> {
            std::shared_ptr<const boolean_backend<coordinate_type, index_type>> delegate_;

          public:
            explicit false_verifying_backend(
                std::shared_ptr<const boolean_backend<coordinate_type, index_type>> delegate)
                : delegate_(std::move(delegate)) {}

            const backend_identity &identity() const noexcept override {
              return delegate_->identity();
            }
            backend_adapter_role role() const noexcept override {
              return backend_adapter_role::producer;
            }

            product_status_or<backend_attempt<coordinate_type, index_type>>
            evaluate(const backend_request<coordinate_type, index_type> &request,
                     const backend_execution_state &state) const override {
              return delegate_->evaluate(request, state);
            }

            product_status_or<bool>
            verify(const backend_request<coordinate_type, index_type> &,
                   const backend_attempt<coordinate_type, index_type> &) const noexcept
                override {
              return false;
            }
          };

          class corrupting_reference_backend final
              : public boolean_backend<coordinate_type, index_type> {
          ''')

          replace_once(
              "tests/Test_MeshesBooleanBackend.cc",
              '''  require(exact.has_value() && reference.has_value(), "make corruption adapters");
            auto registry =
                std::make_shared<backend_registry<coordinate_type, index_type>>();
          ''',
              '''  require(exact.has_value() && reference.has_value(), "make corruption adapters");

            auto false_registry =
                std::make_shared<backend_registry<coordinate_type, index_type>>();
            auto false_verifier = std::make_shared<false_verifying_backend>(exact.value());
            require(false_registry->register_backend(false_verifier).has_value() &&
                        false_registry->freeze().has_value(),
                    "register false-verifying producer");
            auto false_request = make_request(fixture, explicit_exact_options());
            auto false_result = evaluate_backend_request(*false_registry, *false_request);
            require(!false_result.has_value() &&
                        false_result.error().code ==
                            product_error_code::verifier_disagreement &&
                        false_result.error().backend &&
                        same_backend_identity(*false_result.error().backend,
                                              exact.value()->identity()),
                    "adapter verification false blocks publication with provenance");

            auto registry =
                std::make_shared<backend_registry<coordinate_type, index_type>>();
          ''')

          replace_once(
              "docs/MeshBooleanBackendAdapters.md",
              '''replace or silently reject the producer geometry. Corrupt comparison evidence,
          by contrast, fails verification and prevents publication.
          ''',
              '''replace or silently reject the producer geometry. Corrupt comparison evidence,
          by contrast, fails verification and prevents publication. An adapter verifier
          that returns `false` without an error is also treated as `verifier_disagreement`;
          verification hooks cannot silently waive publication checks.
          ''')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'P4 fail-closed changes already present.'
            exit 0
          fi
          git add .
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'P4: enforce adapter verification outcomes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  backend-adapters:
    name: ${{ matrix.compiler }} backend adapters
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p4 -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P4 targets
        run: >-
          cmake --build build-p4
          --target Test_MeshesBooleanProductContract Test_MeshesBooleanExactResult Test_MeshesBooleanBackend
          --parallel 2
      - name: Run P4 adapter and contract tests
        run: >-
          ctest --test-dir build-p4 --output-on-failure
          -R '^(MeshesBooleanProductContract|MeshBooleanExactResult.Unit|MeshBooleanBackend.Unit)$'
          --timeout 360
