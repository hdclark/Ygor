name: Mesh Boolean P5.1 attributes

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanAttributes*'
      - 'src/YgorMeshesBooleanAttributeVerifier.cc'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/YgorMeshesBooleanApproximateVerifier.cc'
      - 'src/YgorMeshesBooleanPreparation*'
      - 'src/YgorMeshesBooleanContract.h'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanAttributes.cc'
      - 'tests/Test_MeshesBooleanProductContract.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p5-attributes.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanAttributes*'
      - 'src/YgorMeshesBooleanAttributeVerifier.cc'
      - 'src/YgorMeshesBooleanProductContract*'
      - 'src/YgorMeshesBooleanExactResult*'
      - 'src/YgorMeshesBooleanApproximateVerifier.cc'
      - 'src/YgorMeshesBooleanPreparation*'
      - 'src/YgorMeshesBooleanContract.h'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanAttributes.cc'
      - 'tests/Test_MeshesBooleanProductContract.cc'
      - 'tests/CMakeLists.txt'
      - 'docs/MeshBooleanProductContract.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p5-attributes.yml'

permissions:
  contents: read

jobs:
  attributes:
    name: ${{ matrix.compiler }} provenance and attributes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p5-attributes -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P5.1 targets
        run: >-
          cmake --build build-p5-attributes
          --target ygor_mesh_boolean_attribute_verifier_isolation
          ygor_mesh_boolean_approximate_verifier_isolation
          Test_MeshesBooleanProductContract
          Test_MeshesBooleanExactResult
          Test_MeshesBooleanAttributes
          Test_MeshesBooleanBackend
          Test_MeshesBooleanApproximate
          Test_MeshesBooleanOutput
          Test_MeshesBooleanEndToEnd
          --parallel 2
      - name: Run P5.1 integration gates
        run: >-
          ctest --test-dir build-p5-attributes --output-on-failure
          -R '^(MeshesBooleanProductContract|MeshBooleanExactResult.Unit|MeshBooleanAttributes.Unit|MeshBooleanBackend.Unit|MeshBooleanApproximate.Adversarial|MeshBooleanOutput.Unit|MeshBoolean.EndToEnd)$'
          --timeout 600
