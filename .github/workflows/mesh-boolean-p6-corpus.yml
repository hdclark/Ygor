name: Mesh Boolean P6.2 permanent corpus

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanQualificationCorpus.*'
      - 'src/YgorMeshesBooleanProductContract.h'
      - 'tests/MeshBooleanQualification.cc'
      - 'tests/mesh_boolean/corpus/**'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-corpus.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanQualificationCorpus.*'
      - 'src/YgorMeshesBooleanProductContract.h'
      - 'tests/MeshBooleanQualification.cc'
      - 'tests/mesh_boolean/corpus/**'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-corpus.yml'

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export Git tree identity
        shell: bash
        run: git rev-parse 'HEAD^{tree}' > /tmp/tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-p6-tree-sha
          path: /tmp/tree-sha.txt
          if-no-files-found: error
          retention-days: 1

  permanent-corpus:
    name: ${{ matrix.compiler }} permanent corpus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p6-corpus -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P6.2 target
        run: >-
          cmake --build build-p6-corpus
          --target MeshBooleanQualification
          --parallel 2
      - name: Run permanent-corpus gates
        run: >-
          ctest --test-dir build-p6-corpus --output-on-failure
          -R '^MeshBoolean\.Qualification$'
          --timeout 600
      - name: Retain failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-boolean-p6-corpus-${{ matrix.compiler }}-failure
          path: build-p6-corpus/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
