name: Mesh Boolean P6.2 permanent corpus

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanQualificationCorpus.*'
      - 'src/YgorMeshesBooleanProductContract.h'
      - 'tests/MeshBooleanQualification.cc'
      - 'tests/mesh_boolean/corpus/**'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-corpus.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanQualificationCorpus.*'
      - 'src/YgorMeshesBooleanProductContract.h'
      - 'tests/MeshBooleanQualification.cc'
      - 'tests/mesh_boolean/corpus/**'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-corpus.yml'

permissions:
  contents: write

jobs:
  apply-p63:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boolean_symbolic
          fetch-depth: 0
      - name: Reconstruct and verify P6.3 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          manifest = [
              ('00', 'src/YgorMeshesBooleanQualificationGeneration.h', '1b083cf474188f940c875439a5873407c9c6c7cf230906b7d5a8454fab97a6d8'),
              ('01', 'src/YgorMeshesBooleanQualificationGeneration.cc', 'ae667d33a8b3b4e58b21a57161cec47fc8b220b34271e2cc7d7e432ee4371c7f'),
              ('02', 'src/YgorMeshesBooleanProductContract.h', 'da24dfb97facfa0c1eee5a7be14e08698a526c897907e0db49f2d4b80f0b1d9b'),
              ('03', 'src/CMakeLists.txt', '7e3f11285878eebb532614ad54ab91ce319f3d04813d60b42fd09b6da090b16d'),
              ('04', 'tests/Test_MeshesBooleanQualificationGeneration.cc', '063b6c32477c24a0a41a1be77deedcf0587d7d941afb89b0393a72b1a6413f89'),
              ('05', 'tests/CMakeLists.txt', 'fec7240b2f34dd72d99cb7e7959c42ea8505ae48ea3b37748419ba5de0a3847d'),
              ('06', 'tests/mesh_boolean/requirements.tsv', 'dfb910a4a774c5a619da2c9f97c1bae42cae18f087072c301fcc05115e32efd8'),
              ('07', 'tests/mesh_boolean/corpus/README.md', '03edfad4b38dba4981fc103ba1cd79d997a7433dd6147b2d43ecf3bc6f111f48'),
              ('08', 'docs/MeshBooleanQualificationGeneration.md', 'd2376621f2b5455b6a192b7dc15a27e4c056914aa7e0109fe311e7da057c9be0'),
              ('09', '.github/workflows/mesh-boolean-p6-generation.yml', '4ae8f48bd07722ac8aa0caf1aa48430825ae30f4826ed4d2a41d1621b8617227'),
          ]
          root = Path('.github/p6-text-payload')
          for key, target_text, expected in manifest:
              parts = sorted((root / key).glob('[0-9][0-9][0-9]'))
              if not parts:
                  raise SystemExit(f'missing staged parts for {key}')
              data = b''.join(part.read_bytes() for part in parts)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch for {target_text}: {actual} != {expected}')
              target = Path(target_text)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Build and test with GCC and Clang
        shell: bash
        run: |
          set -euo pipefail
          for compiler in gcc clang; do
            if [[ "$compiler" == gcc ]]; then
              export CC=gcc CXX=g++
            else
              export CC=clang CXX=clang++
            fi
            build="build-p63-${compiler}"
            cmake -S . -B "$build" -G Ninja \
              -DBUILD_TESTING=ON \
              -DCMAKE_BUILD_TYPE=Debug \
              -DWITH_EIGEN=OFF \
              -DWITH_GNU_GSL=OFF
            cmake --build "$build" \
              --target Test_MeshesBooleanQualificationGeneration \
              --parallel 2
            ctest --test-dir "$build" --output-on-failure \
              -R '^MeshBoolean\.QualificationGeneration$' \
              --timeout 1200
          done
      - name: Finalize tracker and restore workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tracker.md')
          text = path.read_text()
          replacements = {
              '- [ ] **P6.3 — Implement construction-aware generators and operation-chain harnesses.**': '- [x] **P6.3 — Implement construction-aware generators and operation-chain harnesses.**',
              '  - [ ] Add exact halfspace/polytope, profile/extrusion-like, coplanar-overlay, nested-shell/cavity, subdivision, feature-alignment, and representable-transform generators with retained recipes.': '  - [x] Add exact halfspace/polytope, profile/extrusion-like, coplanar-overlay, nested-shell/cavity, subdivision, feature-alignment, and representable-transform generators with retained recipes.',
              '  - [ ] Add valid intersecting-geometry fuzzing; retain disjoint boxes only as a smoke family.': '  - [x] Add valid intersecting-geometry fuzzing; retain disjoint boxes only as a smoke family.',
              '  - [ ] Add invalid/preparation fuzzing with exact defect labels and normalization-report checks.': '  - [x] Add invalid/preparation fuzzing with exact defect labels and normalization-report checks.',
              '  - [ ] Add chain execution with re-ingestion, exact-result retention, varied association/order, explicit normalization boundaries, and transactional failure propagation.': '  - [x] Add chain execution with re-ingestion, exact-result retention, varied association/order, explicit normalization boundaries, and transactional failure propagation.',
              '  - [ ] Add deterministic provenance-guided minimization and automatic permanent-regression promotion.': '  - [x] Add deterministic provenance-guided minimization and automatic permanent-regression promotion.',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'tracker binding mismatch: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -rf .github/p6-text-payload
          rm -f .github/workflows/p6-implementation-bootstrap.yml
          git cat-file blob 216c5144fdd9dafc4757542661d29e788d0408a3 > .github/workflows/mesh-boolean-p6-corpus.yml
          git cat-file blob 2d85f76ff7082fa97fa5980520002c9d6c331753 > .github/workflows/mesh-boolean-p6-workspace.yml
          test "$(git hash-object .github/workflows/mesh-boolean-p6-corpus.yml)" = 216c5144fdd9dafc4757542661d29e788d0408a3
          test "$(git hash-object .github/workflows/mesh-boolean-p6-workspace.yml)" = 2d85f76ff7082fa97fa5980520002c9d6c331753
      - name: Commit and push P6.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Plan 16 P6.3 qualification generators and chains'
          git fetch origin boolean_symbolic
          git rebase origin/boolean_symbolic
          git push origin HEAD:boolean_symbolic

  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Export Git tree identity
        shell: bash
        run: git rev-parse 'HEAD^{tree}' > /tmp/tree-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-p6-tree-sha
          path: /tmp/tree-sha.txt
          if-no-files-found: error
          retention-days: 1

  permanent-corpus:
    name: ${{ matrix.compiler }} permanent corpus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p6-corpus -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P6.2 target
        run: >-
          cmake --build build-p6-corpus
          --target MeshBooleanQualification
          --parallel 2
      - name: Run permanent-corpus gates
        run: >-
          ctest --test-dir build-p6-corpus --output-on-failure
          -R '^MeshBoolean\.Qualification$'
          --timeout 600
      - name: Retain failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-boolean-p6-corpus-${{ matrix.compiler }}-failure
          path: build-p6-corpus/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
