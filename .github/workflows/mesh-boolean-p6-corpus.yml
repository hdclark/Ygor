name: Mesh Boolean P6.2 permanent corpus

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanQualificationCorpus.*'
      - 'src/YgorMeshesBooleanProductContract.h'
      - 'tests/MeshBooleanQualification.cc'
      - 'tests/mesh_boolean/corpus/**'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-corpus.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanQualificationCorpus.*'
      - 'src/YgorMeshesBooleanProductContract.h'
      - 'tests/MeshBooleanQualification.cc'
      - 'tests/mesh_boolean/corpus/**'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-corpus.yml'

permissions:
  contents: write

jobs:
  export-workspace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit exact checkout transport chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/p6-workspace.part-* .github/p6-workspace.sha256
          tar --exclude=.git --exclude=build --exclude=build-* \
              --exclude='.github/p6-workspace.part-*' \
              --exclude='.github/p6-workspace.sha256' \
              -czf /tmp/ygor-p6-workspace.tar.gz .
          sha256sum /tmp/ygor-p6-workspace.tar.gz | awk '{print $1}' > .github/p6-workspace.sha256
          base64 -w 0 /tmp/ygor-p6-workspace.tar.gz | split -b 750000 -d -a 3 - .github/p6-workspace.part-
          git add .github/p6-workspace.part-* .github/p6-workspace.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Export PR workspace archive for P6.3'
          git push origin HEAD:boolean_symbolic

  permanent-corpus:
    name: ${{ matrix.compiler }} permanent corpus
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p6-corpus -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P6.2 target
        run: >-
          cmake --build build-p6-corpus
          --target MeshBooleanQualification
          --parallel 2
      - name: Run permanent-corpus gates
        run: >-
          ctest --test-dir build-p6-corpus --output-on-failure
          -R '^MeshBoolean\.Qualification$'
          --timeout 600
      - name: Retain failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-boolean-p6-corpus-${{ matrix.compiler }}-failure
          path: build-p6-corpus/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
