name: Publish reviewed Mesh Boolean P6.6 ingestion commit

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/mesh-boolean-p6-ingestion-apply.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/mesh-boolean-p6-ingestion-apply.yml'

permissions:
  contents: write

concurrency:
  group: mesh-boolean-p6-ingestion-publish-macos-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  publish-validated-commit:
    name: Publish validated P6.6 commit to staging branch
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: boolean_symbolic
      - name: Reconstruct checked patch and publish staging commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin boolean_symbolic
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/boolean_symbolic)"
          set -- .github/p6-ingestion.patch.part-*
          test "$#" -eq 5
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          parts = sorted(Path('.github').glob('p6-ingestion.patch.part-*'))
          encoded = b''.join(part.read_bytes() for part in parts)
          patch = gzip.decompress(base64.b64decode(encoded))
          expected = '97a76250dab8af604f442e4960950b9112bd008829b4848f355c5d9cee63347f'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch digest mismatch: {actual}')
          Path('/tmp/p6-ingestion.patch').write_bytes(patch)
          PY
          git apply --check /tmp/p6-ingestion.patch
          git apply /tmp/p6-ingestion.patch
          rm -f .github/p6-ingestion.patch.part-*
          rm -f .github/workflows/mesh-boolean-p6-ingestion-apply.yml
          rm -f .github/workflows/mesh-boolean-p6-workspace-export.yml
          git diff --check
          git add .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement P6.6 controlled CAD-like corpus ingestion (plan 16)'
          git push --force origin HEAD:refs/heads/agent/p6-ingestion-publish
