name: Publish reviewed Mesh Boolean P6.6 ingestion commit

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/mesh-boolean-p6-ingestion-apply.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/mesh-boolean-p6-ingestion-apply.yml'

permissions:
  contents: write

concurrency:
  group: mesh-boolean-p6-ingestion-publish-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  publish-validated-commit:
    name: Publish validated P6.6 commit to staging branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: boolean_symbolic
      - name: Reconstruct checked patch and publish staging commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin boolean_symbolic
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/boolean_symbolic)"
          test "$(find .github -maxdepth 1 -name 'p6-ingestion.patch.part-*' -type f | wc -l)" -eq 5
          cat .github/p6-ingestion.patch.part-* | base64 --decode | gzip --decompress > /tmp/p6-ingestion.patch
          echo '97a76250dab8af604f442e4960950b9112bd008829b4848f355c5d9cee63347f  /tmp/p6-ingestion.patch' | sha256sum --check --strict
          git apply --check /tmp/p6-ingestion.patch
          git apply /tmp/p6-ingestion.patch
          rm -f .github/p6-ingestion.patch.part-*
          rm -f .github/workflows/mesh-boolean-p6-ingestion-apply.yml
          rm -f .github/workflows/mesh-boolean-p6-workspace-export.yml
          git diff --check
          git add .
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement P6.6 controlled CAD-like corpus ingestion (plan 16)'
          git push --force origin HEAD:refs/heads/agent/p6-ingestion-publish
