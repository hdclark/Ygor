name: Mesh Boolean P6.6 controlled CAD-like ingestion

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanQualificationIngestion.*'
      - 'src/YgorMeshesBooleanQualificationCorpus.h'
      - 'src/YgorMeshesBooleanQualification.h'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanQualificationIngestion.cc'
      - 'tests/CMakeLists.txt'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'tests/mesh_boolean/cad_ingestion/**'
      - 'docs/MeshBooleanQualificationIngestion.md'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'docs/MeshBooleanQualification.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-ingestion.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanQualificationIngestion.*'
      - 'src/YgorMeshesBooleanQualificationCorpus.h'
      - 'src/YgorMeshesBooleanQualification.h'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanQualificationIngestion.cc'
      - 'tests/CMakeLists.txt'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'tests/mesh_boolean/cad_ingestion/**'
      - 'docs/MeshBooleanQualificationIngestion.md'
      - 'docs/MeshBooleanQualificationCorpus.md'
      - 'docs/MeshBooleanQualification.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-ingestion.yml'

concurrency:
  group: mesh-boolean-p6-ingestion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ingestion-contracts:
    name: ${{ matrix.compiler }} ingestion contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p6-ingestion -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P6.6 target
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-p6-ingestion \
            --target Test_MeshesBooleanQualificationIngestion \
            --parallel 2 2>&1 | tee build-p6-ingestion/p6-ingestion-build.log
      - name: Run ingestion gates
        run: >-
          ctest --test-dir build-p6-ingestion --output-on-failure
          -R '^MeshBoolean\.QualificationIngestion$'
          --timeout 900
      - name: Retain failing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-boolean-p6-ingestion-${{ matrix.compiler }}-failure
          path: |
            build-p6-ingestion/p6-ingestion-build.log
            build-p6-ingestion/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
