name: Mesh Boolean P6.7 qualification suites

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - 'src/YgorMeshesBooleanQualificationSuites.*'
      - 'src/YgorMeshesBooleanNormalization.*'
      - 'src/YgorMeshesBooleanAttributes.*'
      - 'src/YgorMeshesBooleanQualificationAccounting.*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanQualificationSuites.cc'
      - 'tests/CMakeLists.txt'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationSuites.md'
      - 'docs/MeshBooleanQualification.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-suites.yml'
  pull_request:
    paths:
      - 'src/YgorMeshesBooleanQualificationSuites.*'
      - 'src/YgorMeshesBooleanNormalization.*'
      - 'src/YgorMeshesBooleanAttributes.*'
      - 'src/YgorMeshesBooleanQualificationAccounting.*'
      - 'src/CMakeLists.txt'
      - 'tests/Test_MeshesBooleanQualificationSuites.cc'
      - 'tests/CMakeLists.txt'
      - 'tests/mesh_boolean/requirements.tsv'
      - 'docs/MeshBooleanQualificationSuites.md'
      - 'docs/MeshBooleanQualification.md'
      - 'tracker.md'
      - '.github/workflows/mesh-boolean-p6-suites.yml'

permissions:
  contents: read

jobs:
  qualification-suites:
    name: ${{ matrix.compiler }} qualification suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p6-suites -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P6.7 target
        run: >-
          cmake --build build-p6-suites
          --target Test_MeshesBooleanQualificationSuites
          --parallel 2
      - name: Run preparation, result-mode, attribute, and provenance gates
        run: >-
          ctest --test-dir build-p6-suites --output-on-failure
          -R '^MeshBoolean\.QualificationSuites$'
          --timeout 1200
      - name: Retain failing test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-boolean-p6-suites-${{ matrix.compiler }}-failure
          path: build-p6-suites/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
