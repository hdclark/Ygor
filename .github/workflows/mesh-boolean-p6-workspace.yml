name: Temporary Mesh Boolean P6 workspace export

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/mesh-boolean-p6-workspace.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package workspace
        run: |
          tar --exclude=.git --exclude=build --exclude='build-*' -czf /tmp/ygor-p6-workspace.tar.gz .
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: ygor-p6-workspace
          path: /tmp/ygor-p6-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
