name: Mesh Boolean P6 workspace export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Package exact checkout
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=build-* \
              --exclude='.github/p6-workspace.part-*' \
              --exclude='.github/p6-workspace.sha256' \
              -czf /tmp/ygor-p6-workspace.tar.gz .
          sha256sum /tmp/ygor-p6-workspace.tar.gz > /tmp/ygor-p6-workspace.sha256
      - name: Upload workspace archive
        uses: actions/upload-artifact@v4
        with:
          name: p6-workspace-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/ygor-p6-workspace.tar.gz
            /tmp/ygor-p6-workspace.sha256
          if-no-files-found: error
          retention-days: 1
