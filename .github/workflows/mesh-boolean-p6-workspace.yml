name: Validate Mesh Boolean P6.5 accounting fix

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/mesh-boolean-p6-workspace.yml'
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/mesh-boolean-p6-workspace.yml'

concurrency:
  group: mesh-boolean-p6-accounting-fix-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Apply the non-deduced service boundary fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/YgorMeshesBooleanQualificationAccounting.h')
          text = path.read_text()
          old_detail = '''namespace qualification_accounting_detail {
          product_error accounting_error(product_error_code, const char *);
          '''
          new_detail = '''namespace qualification_accounting_detail {
          template <class Value> struct non_deduced { using type = Value; };

          product_error accounting_error(product_error_code, const char *);
          '''
          if text.count(old_detail) != 1:
              raise SystemExit('unexpected qualification_accounting_detail declaration')
          text = text.replace(old_detail, new_detail)

          old_signature = '''observe_qualification_product_success(
              const boolean_product_result<T, I> &result,
              std::shared_ptr<const exact_kernel_services<T>> kernel,
              std::shared_ptr<const verifier_service> verifiers,
              std::vector<qualification_guarded_probe_observation> probes = {},
              bool require_chain_reingestion = false,
              qualification_chain_mesh_consumer<T, I> chain_consumer = {}) {
          '''
          new_signature = '''observe_qualification_product_success(
              const boolean_product_result<T, I> &result,
              typename qualification_accounting_detail::non_deduced<
                  std::shared_ptr<const exact_kernel_services<T>>>::type kernel,
              typename qualification_accounting_detail::non_deduced<
                  std::shared_ptr<const verifier_service>>::type verifiers,
              std::vector<qualification_guarded_probe_observation> probes = {},
              bool require_chain_reingestion = false,
              typename qualification_accounting_detail::non_deduced<
                  qualification_chain_mesh_consumer<T, I>>::type chain_consumer = {}) {
          '''
          if text.count(old_signature) != 1:
              raise SystemExit('unexpected observe_qualification_product_success signature')
          path.write_text(text.replace(old_signature, new_signature))
          PY

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p6-accounting -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF

      - name: Build P6.5 target
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-p6-accounting \
            --target Test_MeshesBooleanQualificationAccounting \
            --parallel 2 2>&1 | tee build-p6-accounting/p6-accounting-build.log

      - name: Run false-success and accounting gates
        run: >-
          ctest --test-dir build-p6-accounting --output-on-failure
          -R '^MeshBoolean\.QualificationAccounting$'
          --timeout 1500

      - name: Retain diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-boolean-p6-accounting-fix-${{ matrix.compiler }}-failure
          path: |
            build-p6-accounting/p6-accounting-build.log
            build-p6-accounting/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
