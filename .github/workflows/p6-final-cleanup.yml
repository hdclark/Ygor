name: Finalize Plan 16 P6.3 cleanup

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/p6-final-cleanup.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/p6-final-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boolean_symbolic
          fetch-depth: 0
      - name: Remove transport and restore permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/p6-workspace.part-* .github/p6-workspace.sha256
          cat > .github/workflows/mesh-boolean-p6-workspace.yml <<'YAML'
          name: Mesh Boolean P6 workspace export

          on:
            push:
              branches:
                - boolean_symbolic

          permissions:
            contents: write

          jobs:
            export:
              if: github.actor != 'github-actions[bot]'
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Package exact checkout into committed transport chunks
                  shell: bash
                  run: |
                    set -euo pipefail
                    rm -f .github/p6-workspace.part-* .github/p6-workspace.sha256
                    tar --exclude=.git --exclude=build --exclude=build-* \
                        --exclude='.github/p6-workspace.part-*' \
                        --exclude='.github/p6-workspace.sha256' \
                        -czf /tmp/ygor-p6-workspace.tar.gz .
                    sha256sum /tmp/ygor-p6-workspace.tar.gz | awk '{print $1}' > .github/p6-workspace.sha256
                    base64 -w 0 /tmp/ygor-p6-workspace.tar.gz | split -b 750000 -d -a 3 - .github/p6-workspace.part-
                    git add .github/p6-workspace.part-* .github/p6-workspace.sha256
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git commit -m 'Export PR workspace archive for P6.3'
                    git push origin HEAD:boolean_symbolic
          YAML
          rm -f .github/workflows/p6-final-cleanup.yml
          test "$(git hash-object .github/workflows/mesh-boolean-p6-workspace.yml)" = 2d85f76ff7082fa97fa5980520002c9d6c331753
          git diff --check
      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Plan 16 P6.3 workflow cleanup'
          git fetch origin boolean_symbolic
          git rebase origin/boolean_symbolic
          git push origin HEAD:boolean_symbolic
