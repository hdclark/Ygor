name: Apply P6.10 manual campaign driver

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/p610-manual-campaign-apply-trigger.md'

permissions:
  contents: write

concurrency:
  group: p610-manual-campaign-apply
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boolean_symbolic
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/p610-manual-campaign.patch.part-* \
            | base64 -d | gzip -d > /tmp/p610-manual-campaign.patch
          echo '5c17b3bd8b658ddd5903bc16cc60de67d67e306f82cf8574186d0153906c1ea9  /tmp/p610-manual-campaign.patch' \
            | sha256sum -c -
          git apply --check /tmp/p610-manual-campaign.patch
          git apply --index /tmp/p610-manual-campaign.patch
          git diff --check --cached

      - name: Validate driver and inventories
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run_mesh_boolean_p610_campaign.sh
          scripts/run_mesh_boolean_p610_campaign.sh --self-test
          python3 - <<'PY'
          from pathlib import Path
          rows = []
          for raw in Path('tests/mesh_boolean/requirements.tsv').read_text().splitlines():
              if not raw or raw.startswith('#'):
                  continue
              fields = raw.split('\t')
              if len(fields) != 6:
                  raise SystemExit(f'malformed requirements row: {raw!r}')
              rows.append(fields[0])
          if rows != sorted(rows):
              raise SystemExit('requirements.tsv is not sorted')
          if len(rows) != len(set(rows)):
              raise SystemExit('requirements.tsv contains duplicate ids')
          print(f'validated {len(rows)} sorted unique requirement ids')
          PY

      - name: Build and run focused P6.10 contracts with GCC
        shell: bash
        env:
          CC: gcc
          CXX: g++
        run: |
          set -euo pipefail
          cmake -S tests/p610 -B build-p610-gcc -G Ninja \
            -DBUILD_TESTING=ON \
            -DYGOR_BUILD_BOOLEAN_TESTS=ON \
            -DYGOR_BUILD_BOOLEAN_BENCHMARKS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF \
            -DYGOR_BOOLEAN_TEST_TIER=continuous
          cmake --build build-p610-gcc \
            --target Test_MeshesBooleanQualificationCandidate --parallel 2
          ctest --test-dir build-p610-gcc --output-on-failure \
            -R '^MeshBoolean\.QualificationCandidate$' --timeout 1200

      - name: Build and run focused P6.10 contracts with Clang
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          cmake -S tests/p610 -B build-p610-clang -G Ninja \
            -DBUILD_TESTING=ON \
            -DYGOR_BUILD_BOOLEAN_TESTS=ON \
            -DYGOR_BUILD_BOOLEAN_BENCHMARKS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMEMORY_CONSTRAINED_BUILD=ON \
            -DWITH_EIGEN=OFF \
            -DWITH_GNU_GSL=OFF \
            -DYGOR_BOOLEAN_TEST_TIER=continuous
          cmake --build build-p610-clang \
            --target Test_MeshesBooleanQualificationCandidate --parallel 2
          ctest --test-dir build-p610-clang --output-on-failure \
            -R '^MeshBoolean\.QualificationCandidate$' --timeout 1200

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/p610-manual-campaign.patch.part-*
          rm -f .github/p610-manual-campaign-apply-trigger.md
          rm -f .github/workflows/p610-manual-campaign-apply.yml
          rm -f .github/workflows/p610-manual-campaign-export.yml
          git add .
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement P6.10 restartable manual campaign driver'
          git push origin HEAD:boolean_symbolic

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p610-manual-campaign-apply-failure
          path: |
            /tmp/p610-manual-campaign.patch
            build-p610-gcc/Testing/Temporary/LastTest.log
            build-p610-clang/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
