name: Inspect P6.7 staged patches

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/p67-bootstrap.yml'
      - '.github/p67.patch.*'
      - '.github/p67code.patch.*'
  pull_request:
    paths:
      - '.github/workflows/p67-bootstrap.yml'
      - '.github/p67.patch.*'
      - '.github/p67code.patch.*'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged patch bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import glob
          import gzip
          from pathlib import Path

          for stem in ('p67.patch', 'p67code.patch'):
              encoded = ''.join(Path(path).read_text(encoding='ascii').strip()
                                for path in sorted(glob.glob(f'.github/{stem}.*')))
              decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
              Path(f'/tmp/{stem}').write_bytes(decoded)
          PY
          echo '=== p67.patch digest/stat ==='
          sha256sum /tmp/p67.patch
          git apply --stat /tmp/p67.patch
          echo '=== p67code.patch digest/stat ==='
          sha256sum /tmp/p67code.patch
          git apply --stat /tmp/p67code.patch
      - name: Upload decoded patches
        uses: actions/upload-artifact@v4
        with:
          name: p67-decoded-patches
          path: |
            /tmp/p67.patch
            /tmp/p67code.patch
          if-no-files-found: error
          retention-days: 1
