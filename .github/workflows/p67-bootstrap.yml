name: Inspect P6.7 staged patches

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/p67-bootstrap.yml'
      - '.github/p67.patch.*'
      - '.github/p67code.patch.*'
  pull_request:
    paths:
      - '.github/workflows/p67-bootstrap.yml'
      - '.github/p67.patch.*'
      - '.github/p67code.patch.*'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode staged patch bundles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import glob
          import gzip
          import traceback
          from pathlib import Path

          diagnostics = []
          for stem in ('p67.patch', 'p67code.patch'):
              paths = sorted(glob.glob(f'.github/{stem}.*'))
              encoded = ''.join(Path(path).read_text(encoding='ascii').strip() for path in paths)
              padding = '=' * ((4 - (len(encoded) % 4)) % 4)
              raw = base64.b64decode(encoded + padding, validate=False)
              Path(f'/tmp/{stem}.gz').write_bytes(raw)
              try:
                  decoded = gzip.decompress(raw)
                  Path(f'/tmp/{stem}').write_bytes(decoded)
                  diagnostics.append(f'{stem}: {len(paths)} chunks, {len(encoded)} base64 chars, {len(raw)} gzip bytes, {len(decoded)} decoded bytes')
              except Exception:
                  diagnostics.append(f'{stem}: decode failure\n{traceback.format_exc()}')
          Path('/tmp/p67-decode-diagnostics.txt').write_text('\n'.join(diagnostics) + '\n', encoding='utf-8')
          PY
          cat /tmp/p67-decode-diagnostics.txt
          for patch in /tmp/p67.patch /tmp/p67code.patch; do
            if [[ -f "$patch" ]]; then
              sha256sum "$patch"
              git apply --stat "$patch" || true
            fi
          done
      - name: Upload decoded patches
        uses: actions/upload-artifact@v4
        with:
          name: p67-decoded-patches
          path: |
            /tmp/p67.patch*
            /tmp/p67code.patch*
            /tmp/p67-decode-diagnostics.txt
          if-no-files-found: error
          retention-days: 1
