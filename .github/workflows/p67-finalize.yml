name: Finalize Mesh Boolean P6.7

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/p67-finalize.yml'

permissions:
  contents: read

concurrency:
  group: mesh-boolean-p67-finalize-hardened
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.compiler }} P6.7 validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Decode reviewed implementation and hardening patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import glob
          import gzip
          from pathlib import Path

          def decode(pattern, destination):
              encoded = ''.join(Path(path).read_text(encoding='ascii').strip()
                                for path in sorted(glob.glob(pattern)))
              Path(destination).write_bytes(
                  gzip.decompress(base64.b64decode(encoded, validate=True)))

          decode('.github/p67.patch.*', '/tmp/p67.patch')
          decode('.github/p67code.patch.*', '/tmp/p67-hardening.patch')
          PY
          echo 'f7bf3d4be781ee2653e4d0c05182a665cfe66d8095a78ecc95b7a06002e34dd8  /tmp/p67.patch' > /tmp/p67.sha256
          echo 'b468b0f413c611646cb78d9c2b1c717ed203920fe2e965b30012021d5846c336  /tmp/p67-hardening.patch' > /tmp/p67-hardening.sha256
          sha256sum --check /tmp/p67.sha256
          sha256sum --check /tmp/p67-hardening.sha256
      - name: Apply reviewed P6.7 implementation and hardening
        shell: bash
        run: |
          set -euo pipefail
          git apply --check \
            --exclude=.github/workflows/mesh-boolean-p6-suites.yml \
            --exclude=.github/workflows/mesh-boolean-workspace-export.yml \
            /tmp/p67.patch
          git apply \
            --exclude=.github/workflows/mesh-boolean-p6-suites.yml \
            --exclude=.github/workflows/mesh-boolean-workspace-export.yml \
            /tmp/p67.patch
          git apply --check /tmp/p67-hardening.patch
          git apply /tmp/p67-hardening.patch
          git diff --check
      - name: Configure focused qualification build
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >-
          cmake -S . -B build-p67-${{ matrix.compiler }} -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS_DEBUG='-O0 -g0'
          -DWITH_EIGEN=OFF
          -DWITH_GNU_GSL=OFF
      - name: Build P6.6 and P6.7 targets
        run: >-
          cmake --build build-p67-${{ matrix.compiler }}
          --target
          Test_MeshesBooleanQualificationIngestion
          Test_MeshesBooleanQualificationSuites
          --parallel 4
      - name: Run focused qualification gates
        run: >-
          ctest --test-dir build-p67-${{ matrix.compiler }} --output-on-failure
          -R '^(MeshBoolean\.QualificationIngestion|MeshBoolean\.QualificationSuites)$'
          --timeout 1200
      - name: Verify tracker boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq -- '- [x] **P6.7 — Add preparation, result-mode, attribute, and provenance qualification suites.**' tracker.md
          grep -Fq -- '- [ ] **P6.8 — Complete compiler, sanitizer, determinism, resource, and fuzz-duration matrices.**' tracker.md
      - name: Retain failing diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p67-hardened-${{ matrix.compiler }}-failure
          path: build-p67-${{ matrix.compiler }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Commit component P6.7
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Decode and apply verified patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import glob
          import gzip
          from pathlib import Path

          def decode(pattern, destination):
              encoded = ''.join(Path(path).read_text(encoding='ascii').strip()
                                for path in sorted(glob.glob(pattern)))
              Path(destination).write_bytes(
                  gzip.decompress(base64.b64decode(encoded, validate=True)))

          decode('.github/p67.patch.*', '/tmp/p67.patch')
          decode('.github/p67code.patch.*', '/tmp/p67-hardening.patch')
          PY
          echo 'f7bf3d4be781ee2653e4d0c05182a665cfe66d8095a78ecc95b7a06002e34dd8  /tmp/p67.patch' > /tmp/p67.sha256
          echo 'b468b0f413c611646cb78d9c2b1c717ed203920fe2e965b30012021d5846c336  /tmp/p67-hardening.patch' > /tmp/p67-hardening.sha256
          sha256sum --check /tmp/p67.sha256
          sha256sum --check /tmp/p67-hardening.sha256
          git apply --check \
            --exclude=.github/workflows/mesh-boolean-p6-suites.yml \
            --exclude=.github/workflows/mesh-boolean-workspace-export.yml \
            /tmp/p67.patch
          git apply \
            --exclude=.github/workflows/mesh-boolean-p6-suites.yml \
            --exclude=.github/workflows/mesh-boolean-workspace-export.yml \
            /tmp/p67.patch
          git apply --check /tmp/p67-hardening.patch
          git apply /tmp/p67-hardening.patch
          git show 171927e57130996344757d2b162e9389db09421a:.github/workflows/mesh-boolean-p6-generation.yml \
            > .github/workflows/mesh-boolean-p6-generation.yml
          rm -f .github/p67.patch.* .github/p67code.patch.*
          rm -f .github/workflows/p67-bootstrap.yml
          rm -f .github/workflows/mesh-boolean-workspace-export.yml
          rm -f .github/workflows/p67-finalize.yml
          ! compgen -G '.github/p67*.patch.*' >/dev/null
          test ! -e .github/workflows/p67-bootstrap.yml
          test ! -e .github/workflows/mesh-boolean-workspace-export.yml
          test ! -e .github/workflows/p67-finalize.yml
          grep -Fq 'name: Mesh Boolean P6.3 generators and chains' .github/workflows/mesh-boolean-p6-generation.yml
          git diff --check
          grep -Fq -- '- [x] **P6.7 — Add preparation, result-mode, attribute, and provenance qualification suites.**' tracker.md
          grep -Fq -- '- [ ] **P6.8 — Complete compiler, sanitizer, determinism, resource, and fuzz-duration matrices.**' tracker.md
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git status --short
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Implement component P6.7 qualification suites'
          git fetch origin boolean_symbolic
          git rebase origin/boolean_symbolic
          git push origin HEAD:boolean_symbolic

# trigger: hardened-reviewed-p67
