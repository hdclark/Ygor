name: Fix and verify P6.10 self-test and smoke campaign

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-p610-verify-export.yml'
      - '.github/p610-smoke-fix.patch'

concurrency:
  group: tmp-p610-final-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: boolean_symbolic
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install --yes -qq cmake ninja-build clang
      - name: Apply reviewed smoke fix
        shell: bash
        run: |
          set -euo pipefail
          echo '4d02ac920648a77cb95f916cf421b295a03cf6b8ea81276518ce4e33ad4becd3  .github/p610-smoke-fix.patch' | sha256sum -c -
          git apply --check .github/p610-smoke-fix.patch
          git apply .github/p610-smoke-fix.patch
          bash -n scripts/run_mesh_boolean_p610_campaign.sh
          git diff --check
          git add scripts/run_mesh_boolean_p610_campaign.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix P6.10 smoke campaign bookkeeping'
      - name: Run driver self-test
        shell: bash
        run: scripts/run_mesh_boolean_p610_campaign.sh --self-test
      - name: Run non-qualifying smoke campaign
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/p610-smoke /tmp/p610-smoke-work
          scripts/run_mesh_boolean_p610_campaign.sh \
            --output /tmp/p610-smoke \
            --work /tmp/p610-smoke-work \
            --smoke \
            --jobs 2 \
            --max-attempts 1 \
            --timeout-seconds 1800 \
            --fuzz-cpu-seconds 1 \
            --fuzz-chunk-seconds 30
      - name: Assert anomaly-free smoke evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/p610-smoke/anomalies.tsv
          test "$(wc -l < /tmp/p610-smoke/anomalies.tsv)" -eq 1
          test "$(awk -F '\t' '$1=="campaign_status"{print $2}' /tmp/p610-smoke/summary.tsv)" = non_qualifying_smoke
          test "$(awk -F '\t' '$1=="unresolved_anomalies"{print $2}' /tmp/p610-smoke/summary.tsv)" -eq 0
          (cd /tmp/p610-smoke && sha256sum -c SHA256SUMS)
      - name: Remove temporary verification files and publish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-p610-verify-export.yml .github/p610-smoke-fix.patch
          git commit --amend --no-edit
          git push origin HEAD:boolean_symbolic
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p610-self-smoke-failure
          path: /tmp/p610-smoke
          if-no-files-found: warn
          retention-days: 3
