name: Temporary P6.10 verification source export

on:
  push:
    branches:
      - boolean_symbolic
    paths:
      - '.github/workflows/tmp-p610-verify-export.yml'
  pull_request:
    paths:
      - '.github/workflows/tmp-p610-verify-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact checkout
        run: tar --exclude=.git -czf /tmp/ygor-p610-verify.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ygor-p610-verify-source
          path: /tmp/ygor-p610-verify.tar.gz
          if-no-files-found: error
          retention-days: 1
