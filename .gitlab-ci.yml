    - cmake --build build-clang --target Test_MeshesBooleanRealization --parallel 2
    - cmake --build build-clang --target Test_MeshesBooleanRealizationProperties --parallel 2
    - cmake --build build-clang --target Test_MeshesBooleanCellClassificationAdversarial --parallel 2
